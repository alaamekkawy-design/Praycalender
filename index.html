<style>
/* ========== كل الأنماط من ICPWA الأصلي ========== */
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; min-width: 0; height: 100%; overflow: hidden; position: relative; }
body {
    background: #1a2a3a;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Cairo', sans-serif;
    padding: 0px;
}
.widget {
    background: #ffffff;
    width: 100%; height: 100%;
    min-width: 0;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    overflow-y: auto;
    overflow-x: hidden;
    border: 1px solid #b0bfcf;
    padding: 2% 2% 2%;
    display: flex;
    flex-direction: column;
    position: relative;
}

/* الأزرار العلوية */
.top-buttons {
    position: sticky;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
    background: inherit;
    padding: 5px 0;
}

.top-btn {
    background: #1a3a6b;
    border: none;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
}

.top-btn:active { transform: scale(0.92); }
body.dark-mode .top-btn { background: #2a5298; }

/* شريط المدن */
.location-bar {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin: 10px 0;
    flex-wrap: wrap;
}
.loc-btn {
    font-family: 'Cairo', sans-serif;
    font-size: 14px;
    padding: 5px 12px;
    border: 1px solid #1a3a6b;
    border-radius: 30px;
    background: white;
    color: #1a3a6b;
    cursor: pointer;
    transition: all 0.2s;
}
.loc-btn.active { background: #1a3a6b; color: white; }
body.dark-mode .loc-btn { background: #0f1e33; color: #a8c8f0; border-color: #2a5298; }
body.dark-mode .loc-btn.active { background: #2a5298; color: white; }

/* التواريخ */
.day-name-ar {
    text-align: center;
    font-family: 'Amiri', serif;
    font-size: clamp(16px, 7vmin, 42px);
    font-weight: 800;
    color: #1a3a6b;
    line-height: 1.1;
    margin: 0 0 1% 0;
    cursor: pointer;
}
.day-name-en {
    text-align: center;
    font-size: clamp(9px, 3.2vmin, 16px);
    font-weight: 700;
    color: #1a3a6b;
    border-radius: 30px;
    border: 1.5px solid #1a3a6b;
    display: inline-block;
    padding: 0.3% 3%;
    margin: 0 auto 1%;
    width: fit-content;
    letter-spacing: 0.5px;
    background: white;
    cursor: pointer;
}
.dates-row {
    display: flex;
    border-top: 1.5px solid #1a3a6b;
    border-bottom: 1.5px solid #1a3a6b;
    margin: 1% 0 1.5%;
    cursor: pointer;
}
.date-block { flex: 1; text-align: center; padding: 1% 2px; }
.date-block:first-child { border-left: 1.5px solid #1a3a6b; }
.date-num {
    font-family: 'Amiri', serif;
    font-size: clamp(24px, 15vmin, 60px);
    font-weight: 800;
    color: #1a3a6b;
    line-height: 1;
}
.date-month-ar {
    font-family: 'Amiri', serif;
    font-size: clamp(14px, 5vmin, 18px);
    font-weight: 700;
    color: #1a3a6b;
}
.date-year {
    font-family: 'Cairo', sans-serif;
    font-size: clamp(12px, 4vmin, 18px);
    font-weight: 800;
    color: #1a3a6b;
}
.gregorian-line {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15%;
    margin: 0.5% 0 1%;
    font-size: clamp(9px, 5vmin, 14px);
    font-weight: 700;
    cursor: pointer;
}
.gregorian-line .badge {
    background: #1a3a6b;
    color: white;
    border-radius: 30px;
    padding: 0.3% 5%;
}
.gregorian-line .coptic {
    border: 1px solid #1a3a6b;
    border-radius: 30px;
    padding: 0.3% 5%;
}

/* جدول المواقيت */
.prayer-table {
    width: 100%;
    border-collapse: collapse;
    font-size: clamp(9px, 2vmin, 14px);
    direction: rtl;
    margin: 10px 0;
}
.prayer-table th, .prayer-table td {
    padding: 2% 1%;
    text-align: center;
    border: 0.5px solid #c5cfe0;
}
.prayer-table th { background: #eef2f9; font-weight: 800; }

/* التنقل بين الأيام */
.day-nav {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin: 10px 0;
}
.nav-btn {
    flex: 1;
    padding: 10px;
    background: white;
    border: 1px solid #1a3a6b;
    border-radius: 30px;
    color: #1a3a6b;
    font-weight: 700;
    cursor: pointer;
}
.nav-btn.today-indicator {
    background: #f0f4fa;
    border-color: #a8c0e8;
    color: #a8c0e8;
    cursor: default;
}

/* الصلاة القادمة */
.next-prayer-box {
    background: #1a3a6b;
    border-radius: 12px;
    margin: 10px 0;
    padding: 15px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    direction: rtl;
    cursor: pointer;
}
.next-prayer-label { color: #a8c0e8; font-size: 12px; }
.next-prayer-name { color: #fff; font-size: 24px; font-weight: 700; }
.next-prayer-time { color: #f0c040; font-size: 16px; }
.countdown-timer { color: #fff; font-size: 28px; font-weight: 700; }

/* الطقس */
.weather-box {
    margin-top: 10px;
    background: linear-gradient(135deg, #1a3a6b 0%, #2a5298 100%);
    border-radius: 16px;
    padding: 15px;
    color: white;
}
.weather-top { display: flex; justify-content: space-between; align-items: center; }
.weather-temp { font-size: 48px; font-weight: 900; }
.weather-icon { width: 60px; height: 60px; }
.weather-details { display: flex; justify-content: space-around; margin-top: 15px; }
.weather-detail { text-align: center; }
.weather-detail-val { font-size: 16px; font-weight: 700; }
.weather-detail-lbl { font-size: 11px; opacity: 0.7; }

/* التذييل */
.footer {
    text-align: center;
    font-family: 'Amiri', serif;
    font-size: 14px;
    font-weight: 600;
    color: #1a3a6b;
    padding: 10px;
    border-top: 1px solid #c5cfe0;
    margin-top: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
}
.footer img { height: 25px; width: 25px; cursor: pointer; }

/* الوضع الليلي */
body.dark-mode { background: #0a0f1a; }
body.dark-mode .widget {
    background: #0f1e33;
    border-color: #1e3a5f;
}
body.dark-mode .day-name-ar,
body.dark-mode .day-name-en,
body.dark-mode .date-num,
body.dark-mode .date-month-ar,
body.dark-mode .date-year,
body.dark-mode .gregorian-line { color: #a8c8f0; }
body.dark-mode .prayer-table th { background: #0a1628; color: #e8f0ff; }
body.dark-mode .prayer-table td { background-color: #0f1e33; color: #a8c8f0; }
body.dark-mode .next-prayer-box { background: #0a1628; }

/* زر التثبيت */
#pwaInstallBtn {
    position: fixed;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: #0f766e;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 50px;
    cursor: pointer;
    z-index: 1001;
    font-family: 'Cairo', sans-serif;
    font-weight: 600;
}
</style>
</head>

<script>
// ======================== بيانات التطبيق الأساسية ========================
const CITIES = [
    { name: 'القاهرة', lat: 30.0444, lng: 31.2357 },
    { name: 'الإسكندرية', lat: 31.2001, lng: 29.9187 },
    { name: 'المنصورة', lat: 31.0364, lng: 31.3807 },
    { name: 'أسوان', lat: 24.0889, lng: 32.8998 }
];

const AR_DAYS = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
const EN_DAYS = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];
const AR_MONTHS_G = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
const EN_MONTHS = ['JANUARY', 'FEBRUARY', 'MARCH', 'APRIL', 'MAY', 'JUNE', 'JULY', 'AUGUST', 'SEPTEMBER', 'OCTOBER', 'NOVEMBER', 'DECEMBER'];
const SYRIAC_MONTHS = ['كانون الثاني', 'شباط', 'آذار', 'نيسان', 'أيار', 'حزيران', 'تموز', 'آب', 'أيلول', 'تشرين الأول', 'تشرين الثاني', 'كانون الأول'];
const COPTIC_MONTHS = ['توت', 'بابه', 'هاتور', 'كيهك', 'طوبه', 'أمشير', 'برمهات', 'برموده', 'بشنس', 'بؤونه', 'أبيب', 'مسرى', 'النسيء'];

let currentCity = 0;
let dayOffset = 0;
let prayerData = null;
let countdownInterval = null;
let darkModeManual = null;
let audioCtx = null;
let alertedFor = null;

// ======================== دوال مساعدة ========================
function toAr(n) { return String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]); }
function getViewDate() {
    const d = new Date();
    d.setDate(d.getDate() + dayOffset);
    d.setHours(12, 0, 0, 0);
    return d;
}
function isToday() { return dayOffset === 0; }
function toCoptic(date) {
    let y = date.getFullYear() - 283;
    let ny = new Date(date.getFullYear(), 8, 11);
    if (date < ny) { y--; ny = new Date(date.getFullYear() - 1, 8, 11); }
    const diff = Math.floor((date - ny) / 86400000);
    const month = Math.floor(diff / 30);
    const day = diff % 30 + 1;
    return { day, month, year: y };
}
function toMins(t24, offset) {
    if (!t24) return null;
    const [h, m] = t24.split(':').map(Number);
    return ((h * 60 + m + (offset || 0)) % 1440 + 1440) % 1440;
}
function fmtTime(t24, offset) {
    const total = toMins(t24, offset);
    if (total === null) return '--:--';
    const h = Math.floor(total / 60), m = total % 60;
    const h12 = (h % 12) || 12;
    const ampm = h < 12 ? 'ص' : 'م';
    return `${h12}:${String(m).padStart(2, '0')} ${ampm}`;
}

// ======================== جلب البيانات ========================
async function fetchPrayerTimes(date, city, madhab) {
    const year = date.getFullYear();
    const month = date.getMonth() + 1;
    const day = date.getDate();
    const school = madhab === 'hanafi' ? 1 : 0;
    const url = `https://api.aladhan.com/v1/timings/${day}-${month}-${year}?latitude=${city.lat}&longitude=${city.lng}&method=5&school=${school}&timezonestring=Africa/Cairo`;
    try {
        const resp = await fetch(url);
        const data = await resp.json();
        if (data.code === 200) return data.data;
        return null;
    } catch(e) { return null; }
}

async function fetchHijriDate(date) {
    const y = date.getFullYear(), m = date.getMonth() + 1, d = date.getDate();
    try {
        const resp = await fetch(`https://api.aladhan.com/v1/gToH/${d}-${m}-${y}`);
        const data = await resp.json();
        if (data.code === 200 && data.data) {
            const hij = data.data.hijri;
            return { day: parseInt(hij.day), monthName: hij.month.ar, year: parseInt(hij.year) };
        }
        return null;
    } catch(e) { return null; }
}

// ======================== عرض البيانات ========================
async function refreshDisplay() {
    const date = getViewDate();
    const settings = window.ICPWASettings ? window.ICPWASettings.get() : { madhab: 'shafi', offsets: {} };
    const city = CITIES[currentCity];
    
    // جلب البيانات
    prayerData = await fetchPrayerTimes(date, city, settings.madhab);
    const hijri = await fetchHijriDate(date);
    
    // تحديث التواريخ
    document.getElementById('dayAr').textContent = AR_DAYS[date.getDay()];
    document.getElementById('dayEn').textContent = EN_DAYS[date.getDay()];
    document.getElementById('gregDay').textContent = toAr(date.getDate());
    document.getElementById('gregMonth').innerHTML = AR_MONTHS_G[date.getMonth()] + `<span style="font-size:0.6em;"> (${SYRIAC_MONTHS[date.getMonth()]})</span>`;
    document.getElementById('gregYear').textContent = toAr(date.getFullYear());
    document.getElementById('gregLineFull').textContent = `${date.getDate()} ${EN_MONTHS[date.getMonth()]} ${date.getFullYear()}`;
    
    if (hijri) {
        document.getElementById('hijriDay').textContent = toAr(hijri.day);
        document.getElementById('hijriMonth').textContent = hijri.monthName;
        document.getElementById('hijriYear').textContent = toAr(hijri.year);
    }
    
    const cop = toCoptic(date);
    document.getElementById('copticSpan').textContent = `${toAr(cop.day)} ${COPTIC_MONTHS[cop.month % 13]} ${toAr(cop.year)}`;
    
    // تحديث جدول المواقيت
    if (prayerData && prayerData.timings) {
        const t = prayerData.timings;
        const o = settings.offsets;
        document.getElementById('prayerBody').innerHTML = `
            <tr><td>${CITIES[0].name}</td>
                <td><span>${fmtTime(t.Fajr, o.fajr)}</span></td>
                <td><span>${fmtTime(t.Sunrise, o.sunrise)}</span></td>
                <td><span>${fmtTime(t.Dhuhr, o.dhuhr)}</span></td>
                <td><span>${fmtTime(t.Asr, o.asr)}</span></td>
                <td><span>${fmtTime(t.Maghrib, o.maghrib)}</span></td>
                <td><span>${fmtTime(t.Isha, o.isha)}</span></td>
            </tr>
        `;
    }
    
    updateCountdown();
}

function updateCountdown() {
    if (!isToday() || !prayerData || !prayerData.timings) {
        document.getElementById('nextPrayerSection').style.display = 'none';
        return;
    }
    document.getElementById('nextPrayerSection').style.display = 'block';
    
    const now = new Date();
    const curMin = now.getHours() * 60 + now.getMinutes();
    const curSec = now.getSeconds();
    const t = prayerData.timings;
    const settings = window.ICPWASettings ? window.ICPWASettings.get() : { offsets: {} };
    const o = settings.offsets;
    
    const prayers = [
        { key: 'fajr', name: 'الفجر', mins: toMins(t.Fajr, o.fajr), disp: fmtTime(t.Fajr, o.fajr) },
        { key: 'sunrise', name: 'الشروق', mins: toMins(t.Sunrise, o.sunrise), disp: fmtTime(t.Sunrise, o.sunrise) },
        { key: 'dhuhr', name: 'الظهر', mins: toMins(t.Dhuhr, o.dhuhr), disp: fmtTime(t.Dhuhr, o.dhuhr) },
        { key: 'asr', name: 'العصر', mins: toMins(t.Asr, o.asr), disp: fmtTime(t.Asr, o.asr) },
        { key: 'maghrib', name: 'المغرب', mins: toMins(t.Maghrib, o.maghrib), disp: fmtTime(t.Maghrib, o.maghrib) },
        { key: 'isha', name: 'العشاء', mins: toMins(t.Isha, o.isha), disp: fmtTime(t.Isha, o.isha) }
    ].filter(p => p.mins !== null);
    
    if (prayers.length === 0) return;
    
    const curTotalSec = curMin * 60 + curSec;
    let next = prayers.find(p => p.mins * 60 > curTotalSec) || prayers[0];
    let diffSec = next.mins * 60 - curTotalSec;
    if (diffSec <= 0) diffSec += 24 * 3600;
    
    const hrs = Math.floor(diffSec / 3600);
    const mins = Math.floor((diffSec % 3600) / 60);
    const secs = diffSec % 60;
    
    document.getElementById('nextPrayerName').textContent = next.name;
    document.getElementById('nextPrayerTime').textContent = next.disp;
    document.getElementById('countdownTimer').textContent = `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    
    // تشغيل الأذان
    if (hrs === 0 && mins === 0 && secs <= 3 && alertedFor !== next.key) {
        alertedFor = next.key;
        playAzan();
    }
    if (diffSec > 60 && alertedFor === next.key) alertedFor = null;
}

// ======================== الأذان ========================
function initAudio() {
    if (!audioCtx) {
        try { audioCtx = new (AudioContext || webkitAudioContext)(); } catch(e) {}
    }
}

function playAzan() {
    const settings = window.ICPWASettings ? window.ICPWASettings.get() : { audio: true };
    if (!settings.audio) return;
    
    initAudio();
    if (!audioCtx) return;
    
    const frequencies = [[523.25, 0], [659.25, 0.5], [783.99, 1], [659.25, 1.5], [523.25, 2]];
    frequencies.forEach(([freq, delay]) => {
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.value = freq;
            const t = audioCtx.currentTime + delay;
            gain.gain.setValueAtTime(0, t);
            gain.gain.linearRampToValueAtTime(0.3, t + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.8);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(t);
            osc.stop(t + 0.8);
        } catch(e) {}
    });
}

// ======================== التنقل بين الأيام ========================
async function changeDay(delta) {
    dayOffset += delta;
    document.getElementById('todayBtn').textContent = dayOffset === 0 ? 'اليوم ✓' : `اليوم (${dayOffset > 0 ? '+' : ''}${dayOffset})`;
    document.getElementById('todayBtn').className = dayOffset === 0 ? 'nav-btn today-indicator' : 'nav-btn';
    await refreshDisplay();
}

async function goToday() {
    if (dayOffset === 0) return;
    dayOffset = 0;
    await refreshDisplay();
    document.getElementById('todayBtn').textContent = 'اليوم ✓';
    document.getElementById('todayBtn').className = 'nav-btn today-indicator';
}

// ======================== شريط المدن ========================
function buildLocationBar() {
    const bar = document.getElementById('locationBar');
    bar.innerHTML = '';
    CITIES.forEach((city, i) => {
        const btn = document.createElement('button');
        btn.className = 'loc-btn' + (i === currentCity ? ' active' : '');
        btn.textContent = city.name;
        btn.onclick = async () => {
            document.querySelectorAll('.loc-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentCity = i;
            if (window.ICPWASettings) window.ICPWASettings.update('cityIdx', i);
            await refreshDisplay();
            if (window.ICPWAWeather) {
                window.ICPWAWeather.load(city.lat, city.lng, city.name, true);
            }
        };
        bar.appendChild(btn);
    });
}

// ======================== منتقي التاريخ ========================
function openDatePicker() {
    if (window.ICPWADatePicker) {
        window.ICPWADatePicker.open();
    }
}

function onDateSelected(year, month, day) {
    const selected = new Date(year, month, day);
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    selected.setHours(0, 0, 0, 0);
    dayOffset = Math.round((selected - today) / 86400000);
    refreshDisplay();
}

function getCurrentDateForPicker() {
    return getViewDate();
}

// ======================== الوضع الليلي ========================
function isDarkTime() {
    if (!prayerData || !prayerData.timings) {
        const h = new Date().getHours();
        return h >= 19 || h < 6;
    }
    const now = new Date();
    const cur = now.getHours() * 60 + now.getMinutes();
    const maghrib = toMins(prayerData.timings.Maghrib, 0);
    const fajr = toMins(prayerData.timings.Fajr, 0);
    if (maghrib === null || fajr === null) return false;
    return cur >= maghrib || cur < fajr;
}

function applyDarkMode(dark) {
    document.body.classList.toggle('dark-mode', dark);
    document.getElementById('darkToggle').textContent = dark ? '☀️' : '🌙';
}

function checkAutoTheme() {
    if (darkModeManual !== null) return;
    applyDarkMode(isDarkTime());
}

document.getElementById('darkToggle').addEventListener('click', () => {
    const isDark = document.body.classList.contains('dark-mode');
    darkModeManual = !isDark;
    applyDarkMode(darkModeManual);
    setTimeout(() => { darkModeManual = null; checkAutoTheme(); }, 6 * 3600 * 1000);
});

// ======================== التهيئة ========================
async function init() {
    buildLocationBar();
    await refreshDisplay();
    loadWeather();
    
    // تهيئة منتقي التاريخ
    if (window.ICPWADatePicker) {
        window.ICPWADatePicker.init(onDateSelected, getCurrentDateForPicker);
    }
    
    // تهيئة حفظ الصورة
    if (window.ICPWASaveImage) {
        window.ICPWASaveImage.init(() => prayerData, getViewDate, CITIES, 
            window.ICPWASettings ? window.ICPWASettings.get() : {});
    }
    
    // تهيئة السحب للتحديث
    if (window.ICPWAPullRefresh) {
        window.ICPWAPullRefresh.init();
    }
    
    // الاستماع لتغيرات الإعدادات
    if (window.ICPWASettings) {
        window.ICPWASettings.onChange(() => {
            refreshDisplay();
            loadWeather();
        });
    }
    
    // تهيئة PWA
    if (window.PWAInstall) {
        window.PWAInstall.init({ swPath: './sw.js', autoRegisterSW: true, showIOSGuideAuto: true });
    }
    
    // بدء المؤقت
    setInterval(() => {
        if (isToday()) updateCountdown();
        else document.getElementById('nextPrayerSection').style.display = 'none';
    }, 1000);
    
    setInterval(() => { if (isToday()) refreshDisplay(); }, 60000);
    checkAutoTheme();
    setInterval(checkAutoTheme, 60000);
}

init();
