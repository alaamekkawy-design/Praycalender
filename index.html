<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"> 
<title>مواقيت الصلاة - مع شاشة تنبيه</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a2a3a;
    font-family: 'Cairo', 'Segoe UI', sans-serif;
    padding: 20px;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .container {
    background: white;
    max-width: 500px;
    width: 100%;
    margin: 0 auto;
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    position: relative;
  }
  
  /* شاشة التنبيه - تظهر كطبقة منبثقة */
  .alert-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.8);
    backdrop-filter: blur(5px);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 10000;
    animation: fadeIn 0.3s ease;
  }
  
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  
  .alert-card {
    background: linear-gradient(135deg, #ffeb3b, #ffc107);
    color: #1a3a6b;
    border-radius: 30px;
    padding: 40px 30px;
    text-align: center;
    max-width: 350px;
    width: 90%;
    animation: shake 0.5s ease;
    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
  }
  
  @keyframes shake {
    0%, 100% { transform: translateY(0); }
    25% { transform: translateY(-10px); }
    75% { transform: translateY(10px); }
  }
  
  .alert-card h2 {
    font-size: 28px;
    margin-bottom: 15px;
  }
  
  .alert-card .prayer-name {
    font-size: 48px;
    font-weight: bold;
    margin: 20px 0;
  }
  
  .alert-card .azan-status {
    font-size: 18px;
    margin: 15px 0;
    color: #d32f2f;
  }
  
  .stop-alert-btn {
    background: #d32f2f;
    color: white;
    border: none;
    padding: 15px 30px;
    border-radius: 50px;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 20px;
    transition: transform 0.2s;
  }
  
  .stop-alert-btn:active { transform: scale(0.95); }
  
  /* البطاقة الرئيسية */
  .prayer-card {
    background: linear-gradient(135deg, #1a3a6b, #0f2a4a);
    color: white;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 20px;
    text-align: center;
  }
  
  .next-prayer-label {
    font-size: 14px;
    opacity: 0.8;
  }
  
  .next-prayer-name {
    font-size: 32px;
    font-weight: bold;
    margin: 10px 0;
  }
  
  .next-prayer-time {
    font-size: 24px;
    color: #f0c040;
  }
  
  .countdown-timer {
    font-size: 36px;
    font-weight: bold;
    margin-top: 15px;
    font-family: monospace;
    background: rgba(0,0,0,0.3);
    padding: 10px;
    border-radius: 12px;
  }
  
  .test-btn, .test-alert-btn {
    background: #4caf50;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 30px;
    font-size: 16px;
    cursor: pointer;
    margin-top: 10px;
    margin-left: 5px;
  }
  
  .test-alert-btn {
    background: #ff9800;
  }
  
  .prayer-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
  }
  
  .prayer-table th, .prayer-table td {
    padding: 10px;
    text-align: center;
    border: 1px solid #ddd;
  }
  
  .prayer-table th {
    background: #1a3a6b;
    color: white;
  }
  
  .date-display {
    text-align: center;
    margin-bottom: 20px;
    font-size: 20px;
    font-weight: bold;
    color: #1a3a6b;
  }
  
  .button-group {
    display: flex;
    gap: 10px;
    justify-content: center;
  }
</style>
</head>
<body>

<div class="container">
  <div class="date-display" id="dateDisplay">تحميل...</div>
  
  <div class="prayer-card">
    <div class="next-prayer-label">الصلاة القادمة</div>
    <div class="next-prayer-name" id="nextPrayerName">---</div>
    <div class="next-prayer-time" id="nextPrayerTime">---</div>
    <div class="countdown-timer" id="countdownTimer">--:--:--</div>
    <div class="button-group">
      <button class="test-btn" id="testAzanBtn">🔊 اختبار الأذان</button>
      <button class="test-alert-btn" id="testAlertBtn">🟡 اختبار شاشة التنبيه</button>
    </div>
  </div>
  
  <table class="prayer-table">
    <thead>
      <tr><th>الصلاة</th><th>الوقت</th></tr>
    </thead>
    <tbody id="prayerTimesBody"></tbody>
  </table>
</div>

<!-- شاشة التنبيه المنبثقة -->
<div class="alert-overlay" id="alertOverlay">
  <div class="alert-card">
    <h2>🕌 وقت الصلاة</h2>
    <div class="prayer-name" id="alertPrayerName">الفجر</div>
    <div class="azan-status" id="azanStatus">🔊 يتم تشغيل الأذان...</div>
    <button class="stop-alert-btn" id="stopAlertBtn">⏹️ إيقاف التنبيه</button>
  </div>
</div>

<script>
// ========== بيانات الموقع ==========
const MY_LOCATION = {
  lat: 30.0444,
  lng: 31.2357,
  name: "القاهرة"
};

// ========== متغيرات التحكم ==========
let currentAudio = null;
let alertActive = false;
let currentPrayerTimes = null;
let countdownInterval = null;
let lastAlertedPrayer = null;

// ========== دوال مساعدة ==========
function toAr(num) {
  return String(num).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
}

// عرض التاريخ
function updateDateDisplay() {
  const now = new Date();
  const days = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
  const months = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
  document.getElementById('dateDisplay').innerHTML = `${days[now.getDay()]} ${toAr(now.getDate())} ${months[now.getMonth()]} ${toAr(now.getFullYear())}`;
}

// ========== نظام الأذان ==========
function stopAzan() {
  if (currentAudio) {
    currentAudio.pause();
    currentAudio.currentTime = 0;
    currentAudio = null;
  }
  document.getElementById('azanStatus').innerHTML = '🔇 تم إيقاف الأذان';
  console.log("🔇 تم إيقاف الأذان");
}

async function playAzan(isTest = false) {
  // إيقاف أي صوت سابق
  stopAzan();
  
  if (isTest) {
    console.log("🔊 تشغيل اختبار الأذان");
    document.getElementById('azanStatus').innerHTML = '🔊 تشغيل اختبار الأذان...';
  } else {
    document.getElementById('azanStatus').innerHTML = '🔊 يتم تشغيل الأذان...';
  }
  
  // المحاولة الأولى: الملف المحلي azan.mp3
  const audioUrls = [
    './azan.mp3',
    '/azan.mp3',
    'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3'
  ];
  
  for (const url of audioUrls) {
    try {
      console.log(`🔄 محاولة تشغيل: ${url}`);
      const audio = new Audio(url);
      audio.loop = true;
      audio.volume = 0.8;
      
      await new Promise((resolve, reject) => {
        audio.oncanplaythrough = () => resolve();
        audio.onerror = () => reject();
        setTimeout(() => reject(), 2000);
      });
      
      await audio.play();
      currentAudio = audio;
      console.log(`✅ تم تشغيل الأذان بنجاح من: ${url}`);
      document.getElementById('azanStatus').innerHTML = '🔊 الأذان يعمل... اضغط إيقاف للإسكات';
      return true;
    } catch(e) {
      console.log(`❌ فشل: ${url}`);
    }
  }
  
  console.log("⚠️ فشل تشغيل الأذان من جميع المصادر");
  document.getElementById('azanStatus').innerHTML = '⚠️ فشل تشغيل الأذان (ملف الصوت غير موجود)';
  return false;
}

// ========== عرض شاشة التنبيه ==========
function showAlertScreen(prayerName) {
  if (alertActive) {
    console.log("التنبيه ظاهر بالفعل");
    return;
  }
  
  console.log(`🔔 عرض شاشة التنبيه لصلاة: ${prayerName}`);
  alertActive = true;
  const overlay = document.getElementById('alertOverlay');
  document.getElementById('alertPrayerName').innerText = prayerName;
  overlay.style.display = 'flex';
  
  // تشغيل الأذان
  playAzan(false);
  
  // اهتزاز الشاشة
  if (navigator.vibrate) {
    navigator.vibrate([500, 300, 500]);
  }
}

function hideAlertScreen() {
  console.log("🔇 إخفاء شاشة التنبيه");
  alertActive = false;
  document.getElementById('alertOverlay').style.display = 'none';
  stopAzan();
}

// ========== جلب مواقيت الصلاة ==========
async function fetchPrayerTimes() {
  const today = new Date();
  const day = today.getDate();
  const month = today.getMonth() + 1;
  const year = today.getFullYear();
  
  const url = `https://api.aladhan.com/v1/timings/${day}-${month}-${year}?latitude=${MY_LOCATION.lat}&longitude=${MY_LOCATION.lng}&method=5&school=0&timezonestring=Africa/Cairo`;
  
  try {
    console.log("🔄 جلب مواقيت الصلاة...");
    const response = await fetch(url);
    const data = await response.json();
    
    if (data.code === 200) {
      currentPrayerTimes = data.data.timings;
      console.log("✅ تم جلب المواقيت بنجاح");
      displayPrayerTimes();
      return true;
    }
  } catch(e) {
    console.log("❌ خطأ في جلب المواقيت:", e);
  }
  return false;
}

function displayPrayerTimes() {
  if (!currentPrayerTimes) return;
  
  const prayers = [
    { name: 'الفجر', time: currentPrayerTimes.Fajr.slice(0,5) },
    { name: 'الشروق', time: currentPrayerTimes.Sunrise.slice(0,5) },
    { name: 'الظهر', time: currentPrayerTimes.Dhuhr.slice(0,5) },
    { name: 'العصر', time: currentPrayerTimes.Asr.slice(0,5) },
    { name: 'المغرب', time: currentPrayerTimes.Maghrib.slice(0,5) },
    { name: 'العشاء', time: currentPrayerTimes.Isha.slice(0,5) }
  ];
  
  const tbody = document.getElementById('prayerTimesBody');
  tbody.innerHTML = '';
  
  prayers.forEach(p => {
    const row = tbody.insertRow();
    row.insertCell(0).innerHTML = `<strong>${p.name}</strong>`;
    const [h, m] = p.time.split(':');
    const hour12 = parseInt(h) % 12 || 12;
    const ampm = parseInt(h) >= 12 ? 'م' : 'ص';
    row.insertCell(1).innerHTML = `${hour12}:${m} ${ampm}`;
  });
}

// ========== حساب الصلاة القادمة والعد التنازلي ==========
function updateCountdown() {
  if (!currentPrayerTimes) return;
  
  const now = new Date();
  const currentMinutes = now.getHours() * 60 + now.getMinutes();
  const currentSeconds = now.getSeconds();
  const currentTotal = currentMinutes * 60 + currentSeconds;
  
  const prayers = [
    { name: 'الفجر', time: currentPrayerTimes.Fajr.slice(0,5), key: 'fajr' },
    { name: 'الظهر', time: currentPrayerTimes.Dhuhr.slice(0,5), key: 'dhuhr' },
    { name: 'العصر', time: currentPrayerTimes.Asr.slice(0,5), key: 'asr' },
    { name: 'المغرب', time: currentPrayerTimes.Maghrib.slice(0,5), key: 'maghrib' },
    { name: 'العشاء', time: currentPrayerTimes.Isha.slice(0,5), key: 'isha' }
  ];
  
  const prayerTimesInSeconds = prayers.map(p => {
    const [h, m] = p.time.split(':');
    return { ...p, totalSeconds: parseInt(h) * 3600 + parseInt(m) * 60 };
  });
  
  let nextPrayer = prayerTimesInSeconds.find(p => p.totalSeconds > currentTotal);
  if (!nextPrayer) {
    nextPrayer = prayerTimesInSeconds[0];
    let diff = (nextPrayer.totalSeconds + 86400) - currentTotal;
    updateDisplay(nextPrayer, diff);
    
    // التحقق من وقت الأذان (لآخر صلاة في اليوم)
    if (diff <= 5 && lastAlertedPrayer !== nextPrayer.key && !alertActive) {
      console.log(`🔔 حان وقت صلاة ${nextPrayer.name}`);
      lastAlertedPrayer = nextPrayer.key;
      showAlertScreen(nextPrayer.name);
    }
    return;
  }
  
  let diff = nextPrayer.totalSeconds - currentTotal;
  updateDisplay(nextPrayer, diff);
  
  // التحقق من وقت الأذان - عندما يتبقى 5 ثوانٍ أو أقل
  if (diff <= 5 && lastAlertedPrayer !== nextPrayer.key && !alertActive) {
    console.log(`🔔 حان وقت صلاة ${nextPrayer.name} (الفرق: ${diff} ثانية)`);
    lastAlertedPrayer = nextPrayer.key;
    showAlertScreen(nextPrayer.name);
  }
  
  // إعادة تعيين التنبيه بعد مرور دقيقة من الصلاة
  if (diff < -60 || diff > 3600) {
    lastAlertedPrayer = null;
  }
}

function updateDisplay(prayer, diffSeconds) {
  document.getElementById('nextPrayerName').innerHTML = prayer.name;
  
  const [h, m] = prayer.time.split(':');
  const hour12 = parseInt(h) % 12 || 12;
  const ampm = parseInt(h) >= 12 ? 'م' : 'ص';
  document.getElementById('nextPrayerTime').innerHTML = `${hour12}:${m} ${ampm}`;
  
  const hours = Math.floor(diffSeconds / 3600);
  const minutes = Math.floor((diffSeconds % 3600) / 60);
  const seconds = diffSeconds % 60;
  document.getElementById('countdownTimer').innerHTML = `${String(hours).padStart(2,'0')}:${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}`;
}

// ========== إعداد الأزرار ==========
function setupButtons() {
  // زر اختبار الأذان
  document.getElementById('testAzanBtn').addEventListener('click', async () => {
    console.log("🔊 اختبار الأذان");
    await playAzan(true);
    if (!currentAudio) {
      alert("⚠️ لا يمكن تشغيل الأذان. تأكد من وجود ملف azan.mp3 في نفس المجلد!");
    }
  });
  
  // زر اختبار شاشة التنبيه (يظهر الشاشة فوراً للاختبار)
  document.getElementById('testAlertBtn').addEventListener('click', () => {
    console.log("🟡 اختبار شاشة التنبيه");
    showAlertScreen("اختبار");
  });
  
  // زر إيقاف التنبيه
  document.getElementById('stopAlertBtn').addEventListener('click', () => {
    console.log("⏹️ تم الضغط على إيقاف التنبيه");
    hideAlertScreen();
  });
}

// ========== تشغيل المؤقت ==========
function startCountdownTimer() {
  if (countdownInterval) clearInterval(countdownInterval);
  updateCountdown();
  countdownInterval = setInterval(updateCountdown, 500);
}

// ========== تفعيل الصوت ==========
let audioUnlocked = false;
function unlockAudioOnUserInteraction() {
  if (audioUnlocked) return;
  audioUnlocked = true;
  console.log("🔓 تم تفعيل الصوت");
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    ctx.resume();
    setTimeout(() => ctx.close(), 100);
  } catch(e) {}
}

document.body.addEventListener('click', unlockAudioOnUserInteraction);
document.body.addEventListener('touchstart', unlockAudioOnUserInteraction);

// ========== تهيئة التطبيق ==========
async function init() {
  updateDateDisplay();
  setupButtons();
  
  console.log("🕌 تطبيق مواقيت الصلاة - جاري التحميل...");
  
  const success = await fetchPrayerTimes();
  if (success) {
    startCountdownTimer();
    console.log("✅ التطبيق جاهز");
  } else {
    console.log("❌ فشل تحميل المواقيت");
  }
}

init();
</script>
</body>
</html>
