<script>
// ======================== بيانات الموقع ========================
const DEFAULT_LOCATION_DATA = { latitude: 0, latitudeDMS: "0°0'0.0000\" N", longitude: 0, longitudeDMS: "0°0'0.0000\" E", address: "------" };
let LOCATION_DATA = { ...DEFAULT_LOCATION_DATA };
let locationIsLive = false;

function toDMS(value, isLat) {
  const abs = Math.abs(value);
  let deg = Math.floor(abs);
  let minFloat = (abs - deg) * 60;
  let min = Math.floor(minFloat);
  let sec = (minFloat - min) * 60;
  if (sec >= 59.99995) { sec = 0; min++; if (min >= 60) { min = 0; deg++; } }
  const dir = isLat ? (value >= 0 ? 'N' : 'S') : (value >= 0 ? 'E' : 'W');
  return deg + "°" + min + "'" + sec.toFixed(4) + '" ' + dir;
}

function getCurrentLocation() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) { reject(new Error('المتصفح لا يدعم تحديد الموقع')); return; }
    navigator.geolocation.getCurrentPosition((pos) => resolve(pos.coords), (err) => reject(err), { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
  });
}

async function reverseGeocode(lat, lng) {
  try {
    const resp = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`, { headers: { 'Accept-Language': 'ar' } });
    const data = await resp.json();
    if (data && data.display_name) return data.display_name;
    return null;
  } catch (e) { return null; }
}

function getGoogleMapsLink() { if (!locationIsLive) return '#'; return 'https://www.google.com/maps?q=' + LOCATION_DATA.latitude + ',' + LOCATION_DATA.longitude; }

function showLocationPopup() {
  const existing = document.querySelector('.location-popup-overlay');
  if (existing) existing.remove();
  const overlay = document.createElement('div');
  overlay.className = 'location-popup-overlay';
  const card = document.createElement('div');
  card.className = 'location-popup-card';
  function renderCard() {
    card.innerHTML = '<div class="popup-header"><h3>📍 موقعي الحالي</h3><button class="close-popup" id="closeLocationPopup">✕</button></div><div class="popup-content"><div class="info-row"><div class="info-label">العنوان التفصيلي ' + (locationIsLive ? '(GPS)' : '(افتراضي)') + '</div><div class="info-value" id="popupAddress">' + escapeHtml(LOCATION_DATA.address) + '</div></div><div class="coord-row"><div class="coord-box"><div class="coord-label">خط العرض</div><div class="coord-value" id="popupLat">' + LOCATION_DATA.latitude + '°</div><div class="coord-value" style="font-size:11px; direction:ltr; margin-top:4px;">' + LOCATION_DATA.latitudeDMS + '</div></div><div class="coord-box"><div class="coord-label">خط الطول</div><div class="coord-value" id="popupLng">' + LOCATION_DATA.longitude + '°</div><div class="coord-value" style="font-size:11px; direction:ltr; margin-top:4px;">' + LOCATION_DATA.longitudeDMS + '</div></div></div><a href="' + getGoogleMapsLink() + '" target="_blank" class="google-link" ' + (locationIsLive ? '' : 'style="opacity:0.5;pointer-events:none;"') + '>🗺️ فتح في خرائط جوجل</a><div class="action-buttons"><button class="action-btn" id="copyAddressBtn" ' + (locationIsLive ? '' : 'disabled style="opacity:0.5;"') + '>📋 نسخ العنوان</button><button class="action-btn" id="copyCoordsBtn" ' + (locationIsLive ? '' : 'disabled style="opacity:0.5;"') + '>📍 نسخ الإحداثيات</button><button class="action-btn" id="shareLocationBtn" ' + (locationIsLive ? '' : 'disabled style="opacity:0.5;"') + '>📤 مشاركة الموقع</button></div><button class="action-btn" id="refreshLocationBtn" style="margin-top:0;">🔄 تحديث الموقع من GPS</button></div>';
    attachCardEvents();
  }
  function attachCardEvents() {
    document.getElementById('closeLocationPopup')?.addEventListener('click', () => overlay.remove());
    document.getElementById('copyAddressBtn')?.addEventListener('click', async () => await copyToClipboard(LOCATION_DATA.address, "تم نسخ العنوان ✅"));
    document.getElementById('copyCoordsBtn')?.addEventListener('click', async () => await copyToClipboard(LOCATION_DATA.latitude + ", " + LOCATION_DATA.longitude, "تم نسخ الإحداثيات 📍"));
    document.getElementById('shareLocationBtn')?.addEventListener('click', async () => {
      const shareData = { title: 'موقعي', text: LOCATION_DATA.address, url: getGoogleMapsLink() };
      if (navigator.share) try { await navigator.share(shareData); } catch(e) {}
      else await copyToClipboard(getGoogleMapsLink(), "رابط الموقع منسوخ");
    });
    document.getElementById('refreshLocationBtn')?.addEventListener('click', () => fetchLiveLocation());
  }
  async function fetchLiveLocation() {
    const btn = document.getElementById('refreshLocationBtn');
    if (btn) { btn.disabled = true; btn.innerText = '⏳ جارٍ تحديد الموقع...'; }
    try {
      const coords = await getCurrentLocation();
      const lat = coords.latitude, lng = coords.longitude;
      const address = await reverseGeocode(lat, lng);
      LOCATION_DATA = { latitude: Math.round(lat * 100000) / 100000, longitude: Math.round(lng * 100000) / 100000, latitudeDMS: toDMS(lat, true), longitudeDMS: toDMS(lng, false), address: address || DEFAULT_LOCATION_DATA.address };
      locationIsLive = true;
      renderCard();
      showToast('تم تحديث الموقع ✅');
    } catch (e) { showToast('تعذر تحديد الموقع'); }
  }
  overlay.appendChild(card);
  document.body.appendChild(overlay);
  renderCard();
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
  fetchLiveLocation();
}

async function copyToClipboard(text, successMsg) {
  try { await navigator.clipboard.writeText(text); showToast(successMsg); } 
  catch { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); showToast(successMsg); }
}
function showToast(msg) {
  const existing = document.querySelector('.copy-success'); if(existing) existing.remove();
  const toast = document.createElement('div'); toast.className = 'copy-success'; toast.innerText = msg; document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 2000);
}
function escapeHtml(str) { return str.replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }

// ======================== دوال الإزاحات ========================
function applyOffsetToTime(time24, offsetMinutes) {
    if (!time24 || time24 === '--:--') return '--:--';
    var parts = time24.split(':');
    var hours = parseInt(parts[0], 10);
    var minutes = parseInt(parts[1], 10);
    var totalMinutes = hours * 60 + minutes + offsetMinutes;
    totalMinutes = ((totalMinutes % 1440) + 1440) % 1440;
    var newHours = Math.floor(totalMinutes / 60);
    var newMinutes = totalMinutes % 60;
    return String(newHours).padStart(2, '0') + ':' + String(newMinutes).padStart(2, '0');
}

function convertTo12HourFormatWithOffset(time24, offset) {
    if (!time24 || time24 === '--:--') return '--:--';
    var adjustedTime = applyOffsetToTime(time24, offset);
    var parts = adjustedTime.split(':');
    var hours = parseInt(parts[0], 10);
    var minutes = parts[1];
    var h12 = (hours % 12) || 12;
    return minutes + ' ' + h12;
}

function getAdjustedMinutes(time24, offset) {
    if (!time24) return null;
    var adjustedTime = applyOffsetToTime(time24, offset);
    var parts = adjustedTime.split(':');
    var hours = parseInt(parts[0], 10);
    var minutes = parseInt(parts[1], 10);
    if (isNaN(hours) || isNaN(minutes)) return null;
    return hours * 60 + minutes;
}

function toCoptic(date) { var y = date.getFullYear() - 283; var ny = new Date(date.getFullYear(), 8, 11); if (date < ny) { y--; ny = new Date(date.getFullYear() - 1, 8, 11); } var diff = Math.floor((date - ny) / 86400000); var month = Math.floor(diff / 30); var day = diff % 30 + 1; return { day: day, month: month, year: y }; }

function unlockAudio() { 
  if(audioUnlocked) return; 
  audioUnlocked=true; 
  try { 
    var ctx = new (AudioContext || webkitAudioContext)(); 
    var buf = ctx.createBuffer(1,1,22050); 
    var src = ctx.createBufferSource(); 
    src.buffer = buf; 
    src.connect(ctx.destination); 
    src.start(0); 
    ctx.resume(); 
  } catch(e){} 
}

document.addEventListener('click', unlockAudio, { once: true });
document.addEventListener('touchstart', unlockAudio, { once: true });

async function requestNotificationPermission() {
    if (!('Notification' in window)) return false;
    if (Notification.permission === 'granted') { notificationPermission = true; return true; }
    if (Notification.permission !== 'denied') {
        const permission = await Notification.requestPermission();
        notificationPermission = (permission === 'granted');
        return notificationPermission;
    }
    return false;
}

function sendNotification(title, body, tag) {
    if (!notificationPermission || !notificationEnabled) return;
    try {
        const notification = new Notification(title, { body: body, icon: './icons/icon-192x192.png', tag: tag, silent: false, vibrate: [200, 100, 200] });
        notification.onclick = function() { window.focus(); notification.close(); };
        setTimeout(function() { notification.close(); }, 8000);
    } catch(e) {}
}

function checkPrayerNotifications() {
    if (!notificationPermission || !notificationEnabled) return;
    if (!prayerData || !prayerData.timings) return;
    if (!isToday()) return;
    const now = new Date();
    const curTotalSec = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
    const t = prayerData.timings;
    const prayers = [
        { key: 'fajr', name: 'الفجر', time: getAdjustedMinutes(t.Fajr, prayerOffsets.fajr) },
        { key: 'dhuhr', name: 'الظهر', time: getAdjustedMinutes(t.Dhuhr, prayerOffsets.dhuhr) },
        { key: 'asr', name: 'العصر', time: getAdjustedMinutes(t.Asr, prayerOffsets.asr) },
        { key: 'maghrib', name: 'المغرب', time: getAdjustedMinutes(t.Maghrib, prayerOffsets.maghrib) },
        { key: 'isha', name: 'العشاء', time: getAdjustedMinutes(t.Isha, prayerOffsets.isha) }
    ].filter(function(p) { return p.time !== null; });
    
    for (var i = 0; i < prayers.length; i++) {
        var prayer = prayers[i];
        var prayerSec = prayer.time * 60;
        var diffSec = prayerSec - curTotalSec;
        if (diffSec <= 0 && diffSec > -15 && lastNotifiedPrayer !== prayer.key) {
            lastNotifiedPrayer = prayer.key;
            sendNotification('🕌 حان وقت صلاة ' + prayer.name, 'الوقت الآن: ' + fmtTimeWithOffset(t[prayer.key], prayerOffsets[prayer.key]), prayer.key);
        }
        var beforeSec = notificationBeforeMinutes * 60;
        if (diffSec > 0 && diffSec <= beforeSec && diffSec > beforeSec - 30 && lastNotifiedPrayer !== prayer.key + '_before') {
            lastNotifiedPrayer = prayer.key + '_before';
            sendNotification('⏰ تذكير: صلاة ' + prayer.name, 'بعد ' + notificationBeforeMinutes + ' دقائق - الوقت: ' + fmtTimeWithOffset(t[prayer.key], prayerOffsets[prayer.key]), prayer.key + '_before');
        }
    }
}

function loadNotificationSettings() {
    var saved = localStorage.getItem('notifications_enabled');
    if (saved !== null) notificationEnabled = saved === 'true';
    var savedMinutes = localStorage.getItem('notifications_minutes');
    if (savedMinutes !== null) notificationBeforeMinutes = parseInt(savedMinutes);
    var cb = document.getElementById('enableNotificationsDrawer');
    if (cb) cb.checked = notificationEnabled;
    var select = document.getElementById('notificationMinutesDrawer');
    if (select) select.value = notificationBeforeMinutes;
    requestNotificationPermission();
}

// ======================== دوال API ========================
async function fetchHijriDate(date) { 
  var y = date.getFullYear(), m = date.getMonth() + 1, d = date.getDate(); 
  try { 
    var resp = await fetch('https://api.aladhan.com/v1/gToH/' + d + '-' + m + '-' + y); 
    var data = await resp.json(); 
    if(data.code === 200 && data.data){ 
      var hij = data.data.hijri; 
      return { day: parseInt(hij.day), monthName: hij.month.ar, year: parseInt(hij.year) }; 
    } 
    return null; 
  } catch(e){ return null; } 
}

function setCachedData(key, data) {
  var cacheData = { data: data, expiry: Date.now() + (30 * 24 * 60 * 60 * 1000) };
  localStorage.setItem(key, JSON.stringify(cacheData));
}

function getCachedData(key) {
  var cached = localStorage.getItem(key);
  if (!cached) return null;
  var cacheData = JSON.parse(cached);
  if (Date.now() > cacheData.expiry) {
    localStorage.removeItem(key);
    return null;
  }
  return cacheData.data;
}

async function fetchPrayerTimesRaw(date, city) { 
  var y = date.getFullYear(), m = date.getMonth() + 1, d = date.getDate(); 
  var cacheKey = 'prayerTimes_' + city.name + '_' + y + '_' + m + '_' + d;
  var cachedData = getCachedData(cacheKey);
  if (cachedData) return cachedData;
  var url = 'https://api.aladhan.com/v1/timings/' + d + '-' + m + '-' + y + '?latitude=' + city.lat + '&longitude=' + city.lng + '&method=5&school=0&midnightMode=1&timezonestring=Africa/Cairo'; 
  try { 
    var resp = await fetch(url); 
    var data = await resp.json(); 
    if (data.code === 200 && data.data) {
      setCachedData(cacheKey, data.data);
      return data.data; 
    } 
    return null; 
  } catch(e) { 
    return null; 
  } 
}

function fmtTimeWithOffset(t24, offset) {
    var total = getAdjustedMinutes(t24, offset);
    if (total === null) return '--:--';
    var h = Math.floor(total / 60);
    var m = total % 60;
    var h12 = (h % 12) || 12;
    var ampm = h < 12 ? 'ص' : 'م';
    return h12 + ':' + String(m).padStart(2, '0') + ' ' + ampm;
}

function updateCountdown() { 
  if(!isToday()){ 
    var s = document.getElementById('nextPrayerSection'); 
    if(s) s.style.display = 'none'; 
    return; 
  } 
  var s2 = document.getElementById('nextPrayerSection'); 
  if(s2) s2.style.display = ''; 
  if(!prayerData || !prayerData.timings) return; 
  var now = new Date(); 
  var curMin = now.getHours() * 60 + now.getMinutes(); 
  var curSec = now.getSeconds(); 
  var t = prayerData.timings; 
  
  var list = [
    {key:'fajr', name:'الفجر', mins: getAdjustedMinutes(t.Fajr, prayerOffsets.fajr), disp: fmtTimeWithOffset(t.Fajr, prayerOffsets.fajr)},
    {key:'sunrise', name:'الشروق', mins: getAdjustedMinutes(t.Sunrise, prayerOffsets.sunrise), disp: fmtTimeWithOffset(t.Sunrise, prayerOffsets.sunrise)},
    {key:'dhuhr', name:'الظهر', mins: getAdjustedMinutes(t.Dhuhr, prayerOffsets.dhuhr), disp: fmtTimeWithOffset(t.Dhuhr, prayerOffsets.dhuhr)},
    {key:'asr', name:'العصر', mins: getAdjustedMinutes(t.Asr, prayerOffsets.asr), disp: fmtTimeWithOffset(t.Asr, prayerOffsets.asr)},
    {key:'maghrib', name:'المغرب', mins: getAdjustedMinutes(t.Maghrib, prayerOffsets.maghrib), disp: fmtTimeWithOffset(t.Maghrib, prayerOffsets.maghrib)},
    {key:'isha', name:'العشاء', mins: getAdjustedMinutes(t.Isha, prayerOffsets.isha), disp: fmtTimeWithOffset(t.Isha, prayerOffsets.isha)}
  ].filter(function(p){ return p.mins !== null; }); 
  
  if(list.length === 0) return; 
  var curTotalSec = curMin * 60 + curSec; 
  var next = list.find(function(p){ return p.mins * 60 > curTotalSec; }) || list[0]; 
  var diffSec = next.mins * 60 - curTotalSec; 
  if(diffSec <= 0) diffSec += 24 * 3600; 
  var hrs = Math.floor(diffSec / 3600), mins = Math.floor((diffSec % 3600) / 60), secs = diffSec % 60; 
  document.getElementById('nextPrayerName').textContent = next.name; 
  document.getElementById('nextPrayerTime').textContent = next.disp; 
  document.getElementById('countdownTimer').textContent = String(hrs).padStart(2,'0') + ':' + String(mins).padStart(2,'0') + ':' + String(secs).padStart(2,'0'); 
  if(hrs === 0 && mins === 0 && secs <= 4 && alertedFor !== next.key){ 
    alertedFor = next.key; 
    playAlert(next.name); 
  } 
  if(diffSec > 60 && alertedFor === next.key) alertedFor = null; 
}

function openDatePicker() { activePickerDate = new Date(currentDisplayDate); renderPicker(); }
function closePicker() { if (pickerModal) pickerModal.remove(); pickerModal = null; }

function renderPicker() { 
  if (pickerModal) pickerModal.remove(); 
  var overlay = document.createElement('div'); 
  overlay.className = 'datepicker-overlay'; 
  var y = activePickerDate.getFullYear(), m = activePickerDate.getMonth(); 
  var firstDay = new Date(y, m, 1).getDay(); 
  var daysInMonth = new Date(y, m + 1, 0).getDate(); 
  var grid = []; 
  for (var i = 0; i < firstDay; i++) grid.push(null); 
  for (var d = 1; d <= daysInMonth; d++) grid.push(new Date(y, m, d)); 
  while (grid.length % 7 !== 0) grid.push(null); 
  var weekdays = ['أحد', 'إثنين', 'ثلاثاء', 'أربعاء', 'خميس', 'جمعة', 'سبت']; 
  
  overlay.innerHTML = '<div class="datepicker-modal"><div class="year-month-control"><button id="prevYear">««</button><button id="prevMonth">‹</button><span id="monthYear">' + AR_MONTHS_G[m] + ' ' + toAr(y) + '</span><button id="nextMonth">›</button><button id="nextYear">»»</button></div><div class="picker-grid" id="pickerGrid"></div><div class="picker-actions"><button id="todayBtn">📅 اليوم</button><button id="saveFromPickerBtn" class="outline">📸 حفظ كصورة</button><button id="closePickerBtn" class="outline">إلغاء</button></div></div>'; 
  
  document.body.appendChild(overlay); 
  pickerModal = overlay; 
  overlay.classList.add('open');
  
  function buildGrid() { 
    var container = document.getElementById('pickerGrid'); 
    container.innerHTML = ''; 
    for (var w = 0; w < weekdays.length; w++) { 
      var d = document.createElement('div'); 
      d.className = 'picker-weekday'; 
      d.innerText = weekdays[w]; 
      container.appendChild(d); 
    } 
    for (var g = 0; g < grid.length; g++) { 
      var dt = grid[g];
      var div = document.createElement('div'); 
      div.className = 'picker-day'; 
      if (!dt) { div.classList.add('empty'); div.innerText = ''; } 
      else { 
        div.innerText = toAr(dt.getDate()); 
        if (dt.toDateString() === currentDisplayDate.toDateString()) div.classList.add('selected'); 
        div.onclick = (function(date) {
          return async function() { 
            currentDisplayDate = new Date(date); 
            updateBackToTodayButton();
            await refreshWidget(currentDisplayDate); 
            closePicker(); 
          };
        })(dt);
      } 
      container.appendChild(div); 
    } 
  } 
  
  function updateGrid() { 
    var ny = activePickerDate.getFullYear(), nm = activePickerDate.getMonth(); 
    document.getElementById('monthYear').innerText = AR_MONTHS_G[nm] + ' ' + toAr(ny); 
    var fd = new Date(ny, nm, 1).getDay(); 
    var dim = new Date(ny, nm + 1, 0).getDate(); 
    var ng = []; 
    for (var i = 0; i < fd; i++) ng.push(null); 
    for (var d = 1; d <= dim; d++) ng.push(new Date(ny, nm, d)); 
    while (ng.length % 7 !== 0) ng.push(null); 
    grid = ng; 
    buildGrid(); 
  } 
  
  document.getElementById('prevMonth').onclick = function() { activePickerDate.setMonth(activePickerDate.getMonth() - 1); updateGrid(); }; 
  document.getElementById('nextMonth').onclick = function() { activePickerDate.setMonth(activePickerDate.getMonth() + 1); updateGrid(); }; 
  document.getElementById('prevYear').onclick = function() { activePickerDate.setFullYear(activePickerDate.getFullYear() - 1); updateGrid(); }; 
  document.getElementById('nextYear').onclick = function() { activePickerDate.setFullYear(activePickerDate.getFullYear() + 1); updateGrid(); }; 
  document.getElementById('todayBtn').onclick = async function() { currentDisplayDate = new Date(); updateBackToTodayButton(); await refreshWidget(currentDisplayDate); closePicker(); }; 
  document.getElementById('closePickerBtn').onclick = closePicker;
  document.getElementById('saveFromPickerBtn').onclick = function() { closePicker(); showSaveDialog(); };
  overlay.onclick = function(e) { if (e.target === overlay) closePicker(); }; 
  buildGrid(); 
}

function isDarkTime(){ 
  if(!prayerData || !prayerData.timings){ 
    var h = new Date().getHours(); 
    return h >= 19 || h < 6; 
  } 
  var now = new Date(); 
  var cur = now.getHours() * 60 + now.getMinutes(); 
  var maghrib = getAdjustedMinutes(prayerData.timings.Maghrib, prayerOffsets.maghrib);
  var fajr = getAdjustedMinutes(prayerData.timings.Fajr, prayerOffsets.fajr);
  if(maghrib === null || fajr === null) return false; 
  return cur >= maghrib || cur < fajr; 
}

function applyDarkMode(dark){ 
  document.body.classList.toggle('dark-mode', dark); 
  document.getElementById('darkToggle').textContent = dark ? '☀️' : '🌙';

function checkAutoTheme(){ 
  if(selectedTheme === 'light') { applyDarkMode(false); return; }
  if(selectedTheme === 'dark') { applyDarkMode(true); return; }
  if(darkModeManual !== null) return; 
  applyDarkMode(isDarkTime()); 
}

    }
    
    var themeRadios = document.querySelectorAll('input[name="themeDrawer"]');
    for (var i = 0; i < themeRadios.length; i++) {
        if (themeRadios[i].checked) selectedTheme = themeRadios[i].value;
    }
    
    var azanRadios = document.querySelectorAll('input[name="azanDrawer"]');

        if (azanRadios[i].checked) selectedAzanIndex = parseInt(azanRadios[i].value);
    }

function registerServiceWorkerWithUpdate() {
    if (!('serviceWorker' in navigator)) return;
    window.addEventListener('load', async function() {
        try {
            var registration = await navigator.serviceWorker.register('/sw.js');
            console.log('✅ Service Worker تم تسجيله بنجاح:', registration);
            function showUpdateNotification(worker) {
                var updateOverlay = document.createElement('div');
                updateOverlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;z-index:10000;font-family:"Cairo",sans-serif;direction:rtl;';
                updateOverlay.innerHTML = '<div style="background:white;border-radius:24px;padding:24px;max-width:320px;text-align:center;animation:slideUp 0.3s ease;"><div style="font-size:48px;margin-bottom:16px;">🔄</div><h3 style="margin-bottom:12px;color:#1a3a6b;">تحديث متاح!</h3><p style="margin-bottom:20px;color:#666;font-size:14px;">نسخة جديدة من التطبيق متاحة. هل تريد التحديث الآن؟</p><div style="display:flex;gap:12px;"><button id="updateConfirm" style="flex:1;background:#1a3a6b;color:white;border:none;padding:10px;border-radius:40px;cursor:pointer;font-weight:600;">✅ تحديث الآن</button><button id="updateLater" style="flex:1;background:#eef2f9;color:#1a3a6b;border:none;padding:10px;border-radius:40px;cursor:pointer;font-weight:600;">⏰ لاحقاً</button></div></div>';
                document.body.appendChild(updateOverlay);
                document.getElementById('updateConfirm').addEventListener('click', function() { worker.postMessage({ type: 'SKIP_WAITING' }); updateOverlay.remove(); window.location.reload(); });
                document.getElementById('updateLater').addEventListener('click', function() { updateOverlay.remove(); });
            }
            if (registration.waiting) showUpdateNotification(registration.waiting);
            registration.addEventListener('updatefound', function() {
                var newWorker = registration.installing;
                newWorker.addEventListener('statechange', function() {
                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) showUpdateNotification(newWorker);
                });
            });
            setInterval(function() { registration.update(); }, 60 * 60 * 1000);
        } catch (error) { console.error('❌ فشل تسجيل Service Worker:', error); }
    });
}
