<head>

<title>التقويم الإسلامي</title>

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; position: relative; }
body {
  background: #1a2a3a;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Cairo', sans-serif;
}
.widget {
  background: #ffffff;
  width: 100%;
  height: 100%;
  border-radius: 12px;
  overflow-y: auto;
  overflow-x: hidden;
  border: 1px solid #b0bfcf;
  padding: 12px;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* الأزرار العلوية */
.top-buttons {
  position: absolute;
  top: 8px;
  left: 8px;
  right: 8px;
  display: flex;
  justify-content: space-between;
  z-index: 10;
}
.top-btn {
  background: #1a3a6b;
  border: none;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  font-size: 18px;
  cursor: pointer;
  color: white;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
}
body.dark-mode .top-btn { background: #2a5298; }

/* شريط المدن */
.city-bar {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin: 45px 0 10px 0;
  flex-wrap: wrap;
}
.city-btn {
  font-family: 'Cairo', sans-serif;
  font-size: 12px;
  padding: 4px 12px;
  border: 1px solid #1a3a6b;
  border-radius: 30px;
  background: white;
  color: #1a3a6b;
  cursor: pointer;
}
.city-btn.active { background: #1a3a6b; color: white; }
body.dark-mode .city-btn { background: #0f1e33; color: #a8c8f0; border-color: #2a5298; }
body.dark-mode .city-btn.active { background: #2a5298; color: white; }

/* التاريخ */
.day-name-ar {
  text-align: center;
  font-family: 'Amiri', serif;
  font-size: 32px;
  font-weight: 800;
  color: #1a3a6b;
  margin: 5px 0 0 0;
}
.day-name-en {
  text-align: center;
  font-size: 12px;
  font-weight: 700;
  color: #1a3a6b;
  letter-spacing: 2px;
  margin: 0px 0 5px 0;
}
.dates-row {
  display: flex;
  justify-content: center;
  align-items: baseline;
  gap: 20px;
  margin: 5px 0;
}
.date-block {
  text-align: center;
  display: flex;
  align-items: baseline;
  gap: 5px;
}
.date-num {
  font-family: 'Amiri', serif;
  font-size: 28px;
  font-weight: 800;
  color: #1a3a6b;
}
.date-month-ar {
  font-family: 'Amiri', serif;
  font-size: 16px;
  font-weight: 700;
  color: #1a3a6b;
}
.date-year {
  font-size: 14px;
  font-weight: 700;
  color: #1a3a6b;
}
.gregorian-line {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 15px;
  margin: 5px 0;
  font-size: 11px;
  font-weight: 700;
}
.gregorian-line .badge {
  background: #1a3a6b;
  color: white;
  border-radius: 20px;
  padding: 2px 10px;
}
.gregorian-line .coptic {
  border: 1px solid #1a3a6b;
  border-radius: 20px;
  padding: 2px 10px;
  color: #1a3a6b;
}

/* جدول المواقيت - سطر واحد */
.prayer-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
  direction: rtl;
  margin: 10px 0;
  background: #f8fafd;
  border-radius: 12px;
  overflow: hidden;
}
.prayer-table th, .prayer-table td {
  padding: 10px 4px;
  text-align: center;
  border: 0.5px solid #c5cfe0;
}
.prayer-table th {
  background: #eef2f9;
  font-weight: 800;
  font-size: 11px;
  color: #1a3a6b;
}
.prayer-table td {
  font-weight: 700;
  color: #1a3a6b;
}
body.dark-mode .prayer-table { background: #0d1a2e; }
body.dark-mode .prayer-table th { background: #0a1628; color: #e8f0ff; }
body.dark-mode .prayer-table td { color: #a8c8f0; border-color: #2a4c7a; }

/* التنقل بين الأيام */
.day-nav {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin: 5px 0;
}
.nav-btn {
  flex: 1;
  padding: 8px;
  background: white;
  border: 1px solid #1a3a6b;
  border-radius: 30px;
  font-weight: 700;
  font-size: 12px;
  cursor: pointer;
}
.nav-btn.today-indicator {
  background: #f0f4fa;
  border-color: #a8c0e8;
  color: #a8c0e8;
  cursor: default;
}
body.dark-mode .nav-btn { background: #0f1e33; color: #a8c8f0; border-color: #2a5298; }

/* الصلاة القادمة */
.next-prayer-box {
  background: #1a3a6b;
  border-radius: 12px;
  padding: 12px;
  margin: 10px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.next-prayer-label { color: #a8c0e8; font-size: 10px; }
.next-prayer-name { color: #fff; font-size: 20px; font-weight: 700; }
.next-prayer-time { color: #f0c040; font-size: 14px; }
.countdown-timer { color: #fff; font-size: 24px; font-weight: 700; }
.test-audio-btn {
  background: rgba(255,255,255,0.15);
  border: none;
  color: #f0c040;
  font-size: 10px;
  padding: 3px 8px;
  border-radius: 20px;
  margin-top: 5px;
  cursor: pointer;
}

/* الطقس */
.weather-box {
  background: linear-gradient(135deg, #1a3a6b, #2a5298);
  border-radius: 12px;
  padding: 12px;
  margin: 10px 0;
  color: white;
}
.weather-top { display: flex; justify-content: space-between; align-items: center; }
.weather-temp { font-size: 32px; font-weight: 900; }
.weather-icon { width: 40px; height: 40px; }
.weather-condition { font-size: 12px; margin-top: 4px; }
.weather-details { display: flex; justify-content: space-around; margin-top: 10px; }
.weather-detail { text-align: center; }
.weather-detail-val { font-size: 14px; font-weight: 700; }
.weather-detail-lbl { font-size: 10px; opacity: 0.7; }

/* زر الموقع */
.location-footer {
  display: flex;
  justify-content: center;
  margin: 5px 0;
}
#locationFooterBtn {
  background: #1a3a6b;
  border: none;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  font-size: 20px;
  cursor: pointer;
  color: white;
}
body.dark-mode #locationFooterBtn { background: #2a5298; }

/* التذييل */
.footer {
  text-align: center;
  font-size: 10px;
  font-weight: 600;
  color: #1a3a6b;
  padding: 10px;
  border-top: 1px solid #c5cfe0;
  margin-top: 5px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.footer img { height: 20px; width: 20px; cursor: pointer; }

body.dark-mode { background: #0a0f1a; }
body.dark-mode .widget { background: #0f1e33; border-color: #1e3a5f; }
body.dark-mode .day-name-ar, body.dark-mode .day-name-en,
body.dark-mode .date-num, body.dark-mode .date-month-ar,
body.dark-mode .date-year, body.dark-mode .gregorian-line { color: #a8c8f0; }
body.dark-mode .gregorian-line .badge { background: #2a5298; }
body.dark-mode .gregorian-line .coptic { border-color: #2a5298; color: #a8c8f0; }
body.dark-mode .next-prayer-box { background: #0a1628; }
body.dark-mode .footer { border-top-color: #1e3a5f; color: #6a90c0; }

#pwaInstallBtn {
  position: fixed;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  background: #0f766e;
  color: white;
  border: none;
  padding: 6px 14px;
  border-radius: 50px;
  cursor: pointer;
  z-index: 1001;
  font-size: 11px;
}
</style>

<script>
// ======================== بيانات التطبيق ========================
const CITIES = [
  { name: 'القاهرة', lat: 30.0444, lng: 31.2357 },

const EN_DAYS = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];

const EN_MONTHS = ['JANUARY', 'FEBRUARY', 'MARCH', 'APRIL', 'MAY', 'JUNE', 'JULY', 'AUGUST', 'SEPTEMBER', 'OCTOBER', 'NOVEMBER', 'DECEMBER'];

let currentCity = 0;
let dayOffset = 0;
let prayerData = null;
let countdownInterval = null;
let darkModeManual = null;
let alertedFor = null;

// إعدادات الصوت
const AZAN_URLS_LIST = ['https://ia800203.us.archive.org/33/items/AzanFajrPrayerFromTheHolyMosqueInMecca/Azan_Fajr_-_Holy_Mosque_Mecca.mp3'];
let azanAudio = null;

function unlockAudio() { if(audioUnlocked) return; audioUnlocked=true; try { const ctx=new (AudioContext||webkitAudioContext)(); const buf=ctx.createBuffer(1,1,22050); const src=ctx.createBufferSource(); src.buffer=buf; src.connect(ctx.destination); src.start(0); ctx.resume(); } catch(e){} }
document.addEventListener('click', unlockAudio, { once: true });
document.addEventListener('touchstart', unlockAudio, { once: true });

function stopAzan() { if(azanAudio) { azanAudio.pause(); azanAudio.currentTime=0; azanAudio=null; } const ov=document.getElementById('azanOverlay'); if(ov) ov.remove(); }

function showAzanOverlay(prayerName) {
  const existingOverlay=document.getElementById('azanOverlay'); if(existingOverlay) existingOverlay.remove();
  const overlay=document.createElement('div'); overlay.id='azanOverlay'; overlay.innerHTML=`<div style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;z-index:2000;"><div style="background:linear-gradient(135deg,#1a3a6b,#0f2a4a);border-radius:32px;padding:40px 30px;text-align:center;max-width:300px;width:85%;"><div style="font-size:64px;">🕌</div><div style="color:#f0c040;font-size:20px;margin-bottom:8px;">حان وقت صلاة</div><div style="color:white;font-size:42px;font-weight:800;margin-bottom:30px;">${prayerName}</div><button id="stopAzanBtn" style="background:#f0c040;border:none;color:#1a3a6b;padding:12px 35px;border-radius:60px;font-size:18px;font-weight:800;cursor:pointer;">⏹ إيقاف الأذان</button></div></div>`;
  document.body.appendChild(overlay);
  const stopBtn=document.getElementById('stopAzanBtn'); if(stopBtn) { stopBtn.addEventListener('click', stopAzan); stopBtn.addEventListener('touchstart', (e)=>{ e.preventDefault(); stopAzan(); }); }
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) stopAzan(); });
}

async function playAlert(prayerName) { unlockAudio(); stopAzan(); showAzanOverlay(prayerName||'الصلاة'); for(const url of AZAN_URLS_LIST) { try { const audio=new Audio(); audio.volume=1.0; audio.src=url; azanAudio=audio; await audio.play(); audio.addEventListener('ended',()=>{ azanAudio=null; const ol=document.getElementById('azanOverlay'); if(ol) ol.remove(); }); return; } catch(e){} } try { const ctx=new (AudioContext||webkitAudioContext)(); await ctx.resume(); [880,660,770,880].forEach((freq,i)=>{ const o=ctx.createOscillator(); const g=ctx.createGain(); o.connect(g); g.connect(ctx.destination); o.frequency.value=freq; const t0=ctx.currentTime+i*0.7; g.gain.setValueAtTime(0.4,t0); g.gain.exponentialRampToValueAtTime(0.001,t0+0.6); o.start(t0); o.stop(t0+0.6); }); } catch(e){} }

// دوال مساعدة
function getViewDate() { const d = new Date(); d.setDate(d.getDate() + dayOffset); return d; }
function isToday() { return dayOffset === 0; }
function toAr(n) { return String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]); }
function toMins(t24, offset) { if(!t24) return null; const parts = t24.split(':'); const h=parseInt(parts[0]), m=parseInt(parts[1]); return h*60+m+(offset||0); }
function fmtTime(t24, offset) { const total=toMins(t24,offset); if(total===null) return '--:--'; const h=Math.floor(total/60), m=total%60; const h12=(h%12)||12; const ampm=h<12?'ص':'م'; return `${h12}:${String(m).padStart(2,'0')} ${ampm}`; }
function convertTo12HourFormat(time24) { if(!time24) return '--:--'; const [h,m]=time24.split(':'); const h12=(parseInt(h)%12)||12; return `${m} ${h12}`; }
function toCoptic(date) { let y=date.getFullYear()-283; let ny=new Date(date.getFullYear(),8,11); if(date<ny) { y--; ny=new Date(date.getFullYear()-1,8,11); } const diff=Math.floor((date-ny)/86400000); const month=Math.floor(diff/30); const day=diff%30+1; return { day, month, year:y }; }

async function fetchPrayerTimes(date, city) {
  const y=date.getFullYear(), m=date.getMonth()+1, d=date.getDate();
  const url=`https://api.aladhan.com/v1/timings/${d}-${m}-${y}?latitude=${city.lat}&longitude=${city.lng}&method=5&school=0&timezonestring=Africa/Cairo`;
  try {
    const resp=await fetch(url);
    const data=await resp.json();
    if(data.code===200) return data.data;
    return null;
  } catch(e) { return null; }
}

async function fetchHijriDate(date) {
  const y=date.getFullYear(), m=date.getMonth()+1, d=date.getDate();
  try {
    const resp=await fetch(`https://api.aladhan.com/v1/gToH/${d}-${m}-${y}`);
    const data=await resp.json();
    if(data.code===200 && data.data) {
      return { day:parseInt(data.data.hijri.day), monthName:data.data.hijri.month.ar, year:parseInt(data.data.hijri.year) };
    }
    return null;
  } catch(e) { return null; }
}

async function updateDisplay() {
  const date = getViewDate();
  const city = CITIES[currentCity];
  
  // تحديث التاريخ
  document.getElementById('dayAr').innerText = AR_DAYS[date.getDay()];
  document.getElementById('dayEn').innerText = EN_DAYS[date.getDay()];
  document.getElementById('gregDay').innerText = toAr(date.getDate());
  document.getElementById('gregMonth').innerHTML = AR_MONTHS_G[date.getMonth()] + ` <span style="font-size:0.6em;">(${SYRIAC_MONTHS[date.getMonth()]})</span>`;
  document.getElementById('gregYear').innerText = toAr(date.getFullYear());
  document.getElementById('gregLineFull').innerText = `${date.getDate()} ${EN_MONTHS[date.getMonth()]} ${date.getFullYear()}`;
  const cop = toCoptic(date);
  document.getElementById('copticSpan').innerText = `${toAr(cop.day)} ${COPTIC_MONTHS[cop.month%13]} ${toAr(cop.year)}`;
  
  // التاريخ الهجري
  const hijri = await fetchHijriDate(date);
  if(hijri) {
    document.getElementById('hijriDay').innerText = toAr(hijri.day);
    document.getElementById('hijriMonth').innerText = hijri.monthName;
    document.getElementById('hijriYear').innerText = toAr(hijri.year);
  }
  
  // مواقيت الصلاة
  prayerData = await fetchPrayerTimes(date, city);
  if(prayerData && prayerData.timings) {
    const t = prayerData.timings;
    document.getElementById('fajrTime').innerText = convertTo12HourFormat(t.Fajr.slice(0,5));
    document.getElementById('sunriseTime').innerText = convertTo12HourFormat(t.Sunrise.slice(0,5));
    document.getElementById('dhuhrTime').innerText = convertTo12HourFormat(t.Dhuhr.slice(0,5));
    document.getElementById('asrTime').innerText = convertTo12HourFormat(t.Asr.slice(0,5));
    document.getElementById('maghribTime').innerText = convertTo12HourFormat(t.Maghrib.slice(0,5));
    document.getElementById('ishaTime').innerText = convertTo12HourFormat(t.Isha.slice(0,5));
  }
  
  updateCountdown();
}

function updateCountdown() {
  if(!isToday() || !prayerData || !prayerData.timings) return;
  const now=new Date();
  const curMin=now.getHours()*60+now.getMinutes();
  const curSec=now.getSeconds();
  const t=prayerData.timings;
  const prayers = [
    {name:'الفجر', mins:toMins(t.Fajr,0), disp:fmtTime(t.Fajr,0)},
    {name:'الشروق', mins:toMins(t.Sunrise,0), disp:fmtTime(t.Sunrise,0)},
    {name:'الظهر', mins:toMins(t.Dhuhr,0), disp:fmtTime(t.Dhuhr,0)},
    {name:'العصر', mins:toMins(t.Asr,0), disp:fmtTime(t.Asr,0)},
    {name:'المغرب', mins:toMins(t.Maghrib,0), disp:fmtTime(t.Maghrib,0)},
    {name:'العشاء', mins:toMins(t.Isha,0), disp:fmtTime(t.Isha,0)}
  ].filter(p=>p.mins!==null);
  
  if(prayers.length===0) return;
  let next = prayers.find(p=>p.mins*60>curMin*60+curSec) || prayers[0];
  let diff = next.mins*60 - (curMin*60+curSec);
  if(diff<=0) diff+=86400;
  const hrs=Math.floor(diff/3600), mins=Math.floor((diff%3600)/60), secs=diff%60;
  document.getElementById('nextPrayerName').innerText = next.name;
  document.getElementById('nextPrayerTime').innerText = next.disp;
  document.getElementById('countdownTimer').innerText = `${String(hrs).padStart(2,'0')}:${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
  
  if(hrs===0 && mins===0 && secs<=3 && alertedFor!==next.name) {
    alertedFor = next.name;
    playAlert(next.name);
  }
  if(diff>60 && alertedFor===next.name) alertedFor=null;
}

// الطقس
async function loadWeather() {
  const city = CITIES[currentCity];
  const box = document.getElementById('weatherBox');
  try {
    const url = `https://wttr.in/${city.lat},${city.lng}?format=j1&lang=ar`;
    const resp = await fetch(url);
    const data = await resp.json();
    if(data && data.current_condition) {
      const c = data.current_condition[0];
      box.innerHTML = `
        <div class="weather-top">
          <div><div class="weather-temp">${c.temp_C}°</div><div class="weather-condition">${c.lang_ar ? c.lang_ar[0].value : c.weatherDesc[0].value}</div></div>
          <img class="weather-icon" src="${c.weatherIconUrl[0].value}">
        </div>
        <div class="weather-details">
          <div class="weather-detail"><div class="weather-detail-val">${c.humidity}%</div><div class="weather-detail-lbl">الرطوبة</div></div>
          <div class="weather-detail"><div class="weather-detail-val">${c.windspeedKmph} كم/س</div><div class="weather-detail-lbl">الرياح</div></div>
        </div>
      `;
    } else { box.innerHTML = '<div style="text-align:center;">⚠️ لا توجد بيانات</div>'; }
  } catch(e) { box.innerHTML = '<div style="text-align:center;">⚠️ تعذر تحميل الطقس</div>'; }
}

// التنقل بين الأيام
async function changeDay(delta) { dayOffset += delta; await updateDisplay(); loadWeather(); document.getElementById('todayBtn').innerText = dayOffset===0 ? 'اليوم ✓' : `اليوم (${dayOffset>0?'+':''}${dayOffset})`; document.getElementById('todayBtn').className = dayOffset===0 ? 'nav-btn today-indicator' : 'nav-btn'; }
async function goToday() { if(dayOffset===0) return; dayOffset=0; await updateDisplay(); loadWeather(); document.getElementById('todayBtn').innerText = 'اليوم ✓'; document.getElementById('todayBtn').className = 'nav-btn today-indicator'; }

// شريط المدن
function buildCityBar() {
  const bar = document.getElementById('cityBar');
  bar.innerHTML = '';
  CITIES.forEach((city, i) => {
    const btn = document.createElement('button');
    btn.className = 'city-btn' + (i===currentCity ? ' active' : '');
    btn.innerText = city.name;
    btn.onclick = async () => {
      currentCity = i;
      document.querySelectorAll('.city-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      await updateDisplay();
      loadWeather();
    };
    bar.appendChild(btn);
  });
}

// الوضع الليلي
function isDarkTime() { const h=new Date().getHours(); return h>=19 || h<6; }
function applyDarkMode(dark) { document.body.classList.toggle('dark-mode', dark); document.getElementById('darkToggle').innerText = dark ? '☀️' : '🌙'; }
function checkAutoTheme() { if(darkModeManual!==null) return; applyDarkMode(isDarkTime()); }
document.getElementById('darkToggle').onclick = () => { darkModeManual = !document.body.classList.contains('dark-mode'); applyDarkMode(darkModeManual); setTimeout(()=>{ darkModeManual=null; checkAutoTheme(); }, 6*3600*1000); };

// ربط الأحداث
document.getElementById('prevDayBtn').onclick = () => changeDay(-1);
document.getElementById('nextDayBtn').onclick = () => changeDay(1);
document.getElementById('todayBtn').onclick = goToday;
document.getElementById('settingsBtn').onclick = () => alert('⚙️ الإعدادات قيد التطوير');
document.getElementById('locationFooterBtn').onclick = () => { if(navigator.geolocation) navigator.geolocation.getCurrentPosition(p=>alert(`📍 ${p.coords.latitude}, ${p.coords.longitude}`),()=>alert('تعذر تحديد الموقع')); else alert('المتصفح لا يدعم الموقع'); };
document.getElementById('testAudioBtn').onclick = () => playAlert('اختبار');
document.getElementById('logoFooter').onclick = () => alert('📱 تطبيق مواقيت الصلاة\nمطور: Alaa Mekkawy\nalaamekkawy@gmail.com');

// التهيئة
buildCityBar();
updateDisplay();
loadWeather();
setInterval(() => { if(isToday()) updateCountdown(); }, 1000);
setInterval(() => { updateDisplay(); loadWeather(); }, 60000);
checkAutoTheme();
setInterval(checkAutoTheme, 60000);

// PWA
if('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(e=>console.log('SW error')); }); }
if(window.PWAInstall) { window.PWAInstall.init({ swPath:'./sw.js', autoRegisterSW:true, showIOSGuideAuto:true }); }
</script>
