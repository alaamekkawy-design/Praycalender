<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"> 
<title>التقويم الإسلامي - مواقيت الصلاة</title> 

<!-- ربط ملفات PWA -->
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icons/icon-192x192.png">
<link rel="apple-touch-icon" href="./icons/icon-192x192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="#0f766e">
<meta name="theme-color" content="#0f766e">
<meta name="mobile-web-app-capable" content="yes">

<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; min-width: 0; height: 100%; overflow: hidden; }
  body {
    background: #1a2a3a;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Cairo', sans-serif;
    padding: 0px;
  }
  .widget {
    background: #ffffff;
    width: 100%; height: 100%;
    min-width: 0;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    overflow: hidden;
    border: 1px solid #b0bfcf;
    padding: 2% 2% 2%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
  }
  .clickable-date { cursor: pointer; transition: opacity 0.1s; }
  .clickable-date:active { opacity: 0.65; }
  .day-name-ar {
    text-align: center;
    font-family: 'Amiri', serif;
    font-size: clamp(16px, 7vmin, 42px);
    font-weight: 800;
    color: #1a3a6b;
    line-height: 1.1;
    margin: 0 0 1% 0;
  }
  .day-name-en {
    text-align: center;
    font-size: clamp(9px, 3.2vmin, 16px);
    font-weight: 700;
    color: #1a3a6b;
    border-radius: 30px;
    border: 1.5px solid #1a3a6b;
    display: inline-block;
    padding: 0.3% 3%;
    margin: 0 auto 1%;
    width: fit-content;
    letter-spacing: 0.5px;
    background: white;
  }
  .dates-row {
    display: flex;
    border-top: 1.5px solid #1a3a6b;
    border-bottom: 1.5px solid #1a3a6b;
    margin: 1% 0 1.5%;
    flex: 0 0 auto;
  }
  .date-block {
    flex: 1;
    text-align: center;
    padding: 1% 2px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.5%;
  }
  .date-block:first-child { border-left: 1.5px solid #1a3a6b; }
  .date-num {
    font-family: 'Amiri', serif;
    font-size: clamp(24px, 15vmin, 60px);
    font-weight: 800;
    color: #1a3a6b;
    line-height: 1;
  }
  .date-month-ar {
    font-family: 'Amiri', serif;
    font-size: clamp(14px, 5vmin, 18px);
    font-weight: 700;
    color: #1a3a6b;
    padding: 0.3% 1%;
    border-radius: 30px;
    white-space: nowrap;
  }
  .date-month-syr {
    font-family: 'Amiri', serif;
    font-size: clamp(.7em, 2.5vmin, 1.5em);
    font-weight: 600;
    color: #1a3a6b;
    background: transparent;
    opacity: 0.75;
    white-space: nowrap;
  }
  .date-year {
    font-family: 'Cairo', sans-serif;
    font-size: clamp(12px, 4vmin, 18px);
    font-weight: 800;
    color: #1a3a6b;
  }
  .gregorian-line {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15%;
    margin: 0.5% 0 1%;
    font-size: clamp(9px, 5vmin, 14px);
    color: #1a3a6b;
    font-weight: 700;
    cursor: pointer;
  }
  .gregorian-line .badge {
    background: #1a3a6b;
    color: white;
    border: 1px solid #1a3a6b;
    padding: 0.3% 5%;
    border-radius: 30px;
    white-space: nowrap;
  }
  .gregorian-line .coptic {
    border: 1px solid #1a3a6b;
    padding: 0.3% 5%;
    border-radius: 30px;
    white-space: nowrap;
  }
  .table-footer-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
    gap: 1%;
  }
  .prayer-table {
    width: 100%;
    border-collapse: collapse;
    font-size: clamp(8px, 1.6vmin, 13px);
    direction: rtl;
    table-layout: fixed;
    flex-shrink: 0;
  }
  .prayer-table th, .prayer-table td {
    padding: 1.5% 0%;
    text-align: center;
    border: 0.5px solid #c5cfe0;
    color: #1a3a6b;
    font-weight: 500;
  }
  .prayer-table th {
    background: #eef2f9;
    font-weight: 800;
    font-size: clamp(8px, 3vmin, 12px);
  }
  .prayer-table td:first-child {
    font-weight: 800;
    background: #f8fafd;
    font-size: clamp(8px, 2vmin, 12px);
  }
  .prayer-table td span {
    font-weight: 800;
    font-family: monospace;
    font-size: clamp(8px, 3vmin, 12px);
    letter-spacing: 0.3px;
  }
  .footer {
    text-align: center;
    font-family: 'Amiri', serif;
    font-size: clamp(8px, 3vmin, 11px);
    font-weight: 600;
    color: #1a3a6b;
    padding-top: 1%;
    border-top: 1px solid #c5cfe0;
    background: white;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex-shrink: 0;
  }
  .next-prayer-box {
    background: #1a3a6b;
    border-radius: 8px;
    margin-top: 2vw;
    padding: 2vw 3vw;
    display: flex;
    align-items: center;
    justify-content: space-between;
    direction: rtl;
  }
  .next-prayer-label { color: #a8c0e8; font-size: 2.5vw; font-weight: 600; }
  .next-prayer-name  { color: #fff; font-family: 'Amiri', serif; font-size: 5vw; font-weight: 700; margin-top: .5vw; }
  .next-prayer-time  { color: #f0c040; font-size: 3vw; font-weight: 600; margin-top: .3vw; }
  .countdown-box     { text-align: center; }
  .countdown-label   { color: #a8c0e8; font-size: 2.5vw; }
  .countdown-timer   { color: #fff; font-size: 6vw; font-weight: 700; letter-spacing: 1px; margin-top: .5vw; }

  /* DARK MODE */
  body.dark-mode { background: #0a0f1a; }
  body.dark-mode .widget {
    background: #0f1e33;
    border-color: #1e3a5f;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
  }
  body.dark-mode .day-name-ar,
  body.dark-mode .day-name-en,
  body.dark-mode .date-num,
  body.dark-mode .date-month-ar,
  body.dark-mode .date-month-syr,
  body.dark-mode .date-year,
  body.dark-mode .gregorian-line { color: #a8c8f0; }
  body.dark-mode .day-name-en {
    background: #0f1e33;
    border-color: #2a5298;
  }
  body.dark-mode .dates-row { border-color: #2a5298; }
  body.dark-mode .date-block:first-child { border-left-color: #2a5298; }
  body.dark-mode .gregorian-line .badge {
    background: #2a5298;
    border-color: #2a5298;
    color: #e8f0ff;
  }
  body.dark-mode .gregorian-line .coptic {
    border-color: #2a5298;
    color: #a8c8f0;
  }
  body.dark-mode .prayer-table th,
  body.dark-mode .prayer-table td { color: #a8c8f0; border-color: #1e3a5f; }
  body.dark-mode .prayer-table th { background: #0a1628; }
  body.dark-mode .prayer-table td:first-child { background: #0d1a2e; }
  body.dark-mode .footer {
    background: #0f1e33;
    border-top-color: #1e3a5f;
    color: #6a90c0;
  }
  body.dark-mode .next-prayer-box { background: #0a1628; }

  /* أزرار التحكم */
  #locationBtn {
    position: absolute;
    top: 8px;
    left: 8px;
    background: #1a3a6b;
    border: none;
    font-size: clamp(14px, 4vmin, 18px);
    cursor: pointer;
    z-index: 10;
    padding: 6px 12px;
    border-radius: 30px;
    color: white;
    font-weight: 600;
    transition: all 0.2s ease;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #locationBtn:active { transform: scale(0.95); }
  body.dark-mode #locationBtn { background: #2a5298; }

  #darkToggle {
    position: absolute;
    top: 8px;
    right: 8px;
    background: none;
    border: none;
    font-size: clamp(16px, 4vmin, 20px);
    cursor: pointer;
    opacity: 0.7;
    z-index: 10;
    padding: 4px 8px;
  }
  #darkToggle:hover { opacity: 1; }

  /* زر التثبيت */
  #installBtn {
    position: absolute;
    bottom: 80px;
    right: 8px;
    background: #0f766e;
    border: none;
    font-size: clamp(12px, 3vmin, 14px);
    cursor: pointer;
    z-index: 10;
    padding: 8px 12px;
    border-radius: 30px;
    color: white;
    font-weight: 600;
    transition: all 0.2s ease;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    display: none;
    align-items: center;
    gap: 6px;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); background: #0d9488; }
  }
  #installBtn:active { transform: scale(0.95); }
  body.dark-mode #installBtn { background: #0d9488; }

  /* POPUP الموقع */
  .location-popup-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(5px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2000;
    direction: rtl;
  }
  .location-popup-card {
    background: #fff;
    width: 90%;
    max-width: 400px;
    border-radius: 28px;
    overflow: hidden;
    animation: slideUp 0.3s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(40px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  body.dark-mode .location-popup-card {
    background: #0f1e33;
    border: 1px solid #2a5298;
  }
  .popup-header {
    background: #1a3a6b;
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: white;
  }
  .popup-header h3 { font-size: 1.2rem; display: flex; align-items: center; gap: 8px; }
  .close-popup {
    background: rgba(255,255,255,0.2);
    border: none;
    width: 32px; height: 32px;
    border-radius: 40px;
    font-size: 20px;
    cursor: pointer;
    color: white;
  }
  .popup-content { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .info-row {
    background: #f8fafd;
    padding: 12px 14px;
    border-radius: 20px;
  }
  body.dark-mode .info-row { background: #0d1a2e; }
  .info-label { font-size: 11px; font-weight: 700; color: #6c86a3; margin-bottom: 4px; }
  .info-value { font-size: 14px; font-weight: 600; color: #1a2c44; word-break: break-word; }
  body.dark-mode .info-value { color: #cde1ff; }
  .coord-row { display: flex; gap: 12px; }
  .coord-box {
    flex: 1;
    background: #eef2f9;
    border-radius: 16px;
    padding: 10px;
    text-align: center;
  }
  body.dark-mode .coord-box { background: #101c30; }
  .coord-label { font-size: 10px; font-weight: 600; color: #4a627a; }
  .coord-value { font-size: 13px; font-weight: 800; margin-top: 4px; color: #1a3a6b; }
  .google-link {
    background: #1a73e8;
    color: white;
    text-decoration: none;
    text-align: center;
    padding: 12px;
    border-radius: 60px;
    font-weight: 700;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .action-buttons { display: flex; gap: 10px; }
  .action-btn {
    flex: 1;
    background: #eef2f9;
    border: none;
    padding: 10px;
    border-radius: 40px;
    font-weight: 700;
    font-size: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    color: #1a3a6b;
  }
  body.dark-mode .action-btn { background: #101c30; color: #cde1ff; }
  .copy-success {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: #1a3a6b;
    color: white;
    padding: 8px 20px;
    border-radius: 50px;
    font-size: 12px;
    z-index: 2100;
    animation: fadeOut 2s forwards;
  }
  @keyframes fadeOut {
    0% { opacity: 1; }
    70% { opacity: 1; }
    100% { opacity: 0; visibility: hidden; }
  }
  .datepicker-overlay { /* نفس الكود السابق */ position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:1000; direction:rtl; }
  .datepicker-modal { background:white; width:330px; max-width:90%; border-radius:24px; padding:14px; text-align:center; }
  body.dark-mode .datepicker-modal { background:#0f1e33; color:#fff; }
  .year-month-control { display:flex; gap:10px; align-items:center; background:#eef2f7; padding:5px 12px; border-radius:50px; margin:0 auto 12px; width:fit-content; }
  body.dark-mode .year-month-control { background:#1e3a5f; }
  .year-month-control button { background:none; border:none; font-size:18px; font-weight:bold; cursor:pointer; padding:2px 10px; color:#1a3a6b; }
  body.dark-mode .year-month-control button { color:#a8c8f0; }
  .picker-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin:12px 0; }
  .picker-weekday { font-size:11px; font-weight:bold; color:#1a3a6b; background:#eef2f7; padding:5px 0; border-radius:30px; text-align:center; }
  body.dark-mode .picker-weekday { background:#1e3a5f; color:#a8c8f0; }
  .picker-day { background:#f9f9fc; padding:7px 0; border-radius:40px; font-size:13px; font-weight:600; cursor:pointer; color:#1f2e4a; text-align:center; }
  body.dark-mode .picker-day { background:#0d1a2e; color:#cde1ff; }
  .picker-day.selected { background:#1a3a6b; color:white; }
  .picker-day.empty { background:transparent; cursor:default; }
  .picker-actions { display:flex; gap:10px; margin-top:8px; }
  .picker-actions button { flex:1; background:#1a3a6b; border:none; color:white; padding:7px; border-radius:40px; font-weight:bold; cursor:pointer; }
  .picker-actions button.outline { background:#e0e5ec; color:#1a3a6b; }
  body.dark-mode .picker-actions button.outline { background:#2a5298; color:#fff; }
</style>
</head>
<body>

<div class="widget" id="widget">
  <button id="locationBtn" title="الموقع">📍 الموقع</button>
  <button id="darkToggle" title="الوضع الليلي">🌙</button>
  <button id="installBtn" title="تثبيت التطبيق">📲 تثبيت التطبيق</button>
  
  <div class="day-name-ar clickable-date" id="dayAr">...</div>
  <div class="day-name-en clickable-date" id="dayEn">...</div>
  <div class="dates-row">
    <div class="date-block clickable-date" id="gregBlock">
      <span class="date-num" id="gregDay">...</span>
      <span class="date-month-ar" id="gregMonth">...</span>
      <span class="date-year" id="gregYear">...</span>
    </div>
    <div class="date-block clickable-date" id="hijriBlock">
      <span class="date-num" id="hijriDay">...</span>
      <span class="date-month-ar" id="hijriMonth">...</span>
      <span class="date-year" id="hijriYear">...</span>
    </div>
  </div>
  <div class="gregorian-line clickable-date" id="gregLineFullBlock">
    <span class="badge" id="gregLineFull">...</span>
    <span id="copticSpan" class="coptic">...</span>
  </div>

  <div id="nextPrayerSection">
    <div class="next-prayer-box">
      <div>
        <div class="next-prayer-label">الصلاة القادمة</div>
        <div class="next-prayer-name" id="nextPrayerName">-</div>
        <div class="next-prayer-time" id="nextPrayerTime">-</div>
      </div>
      <div class="countdown-box">
        <div class="countdown-label">الوقت المتبقي</div>
        <div class="countdown-timer" id="countdownTimer">--:--:--</div>
        <div style="margin-top:1vw;text-align:center;">
          <button onclick="window.playAlert('اختبار')" style="background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.4);color:#f0c040;font-family:Cairo,sans-serif;font-size:clamp(8px,2.2vmin,12px);font-weight:700;padding:2px 10px;border-radius:20px;cursor:pointer;">🔊 اختبار الأذان</button>
        </div>
      </div>
    </div>
  </div>

  <div class="table-footer-container">
    <table class="prayer-table">
      <thead><tr><th>المواقيت</th><th>فجر</th><th>شروق</th><th>ظهر</th><th>عصر</th><th>مغرب</th><th>عشاء</th></tr></thead>
      <tbody id="prayerBody"></tbody>
    </table>
    <div class="footer">
      <span onclick="location.reload();" style="cursor:pointer;">Mekkawy | المذهب الشافعي | تقويم هيئة المساحة المصرية</span>
    </div>
  </div>
</div>

<script>
// بيانات الموقع من الصورة
const LOCATION_DATA = {
  latitude: 30.13836,
  latitudeDMS: "30°8'18.10104\" N",
  longitude: 31.38092,
  longitudeDMS: "31°22'51.3228\" E",
  address: "49QJ+9CJ, Keblet Al Masged, Berket an Nasr, Al Salam First, Cairo Governorate 4642140, Egypt"
};

function getGoogleMapsLink() {
  return `https://www.google.com/maps?q=${LOCATION_DATA.latitude},${LOCATION_DATA.longitude}`;
}

function showLocationPopup() {
  const existing = document.querySelector('.location-popup-overlay');
  if(existing) existing.remove();
  
  const overlay = document.createElement('div');
  overlay.className = 'location-popup-overlay';
  overlay.innerHTML = `
    <div class="location-popup-card">
      <div class="popup-header">
        <h3>📍 موقعي الحالي</h3>
        <button class="close-popup">✕</button>
      </div>
      <div class="popup-content">
        <div class="info-row">
          <div class="info-label">العنوان التفصيلي</div>
          <div class="info-value">${escapeHtml(LOCATION_DATA.address)}</div>
        </div>
        <div class="coord-row">
          <div class="coord-box">
            <div class="coord-label">خط العرض</div>
            <div class="coord-value">${LOCATION_DATA.latitude}°</div>
            <div style="font-size:10px; direction:ltr;">${LOCATION_DATA.latitudeDMS}</div>
          </div>
          <div class="coord-box">
            <div class="coord-label">خط الطول</div>
            <div class="coord-value">${LOCATION_DATA.longitude}°</div>
            <div style="font-size:10px; direction:ltr;">${LOCATION_DATA.longitudeDMS}</div>
          </div>
        </div>
        <a href="${getGoogleMapsLink()}" target="_blank" class="google-link">🗺️ فتح في خرائط جوجل</a>
        <div class="action-buttons">
          <button class="action-btn" id="copyAddressBtn">📋 نسخ العنوان</button>
          <button class="action-btn" id="copyCoordsBtn">📍 نسخ الإحداثيات</button>
          <button class="action-btn" id="shareLocationBtn">📤 مشاركة</button>
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  
  overlay.querySelector('.close-popup').onclick = () => overlay.remove();
  overlay.onclick = (e) => { if(e.target === overlay) overlay.remove(); };
  
  document.getElementById('copyAddressBtn').onclick = () => copyToClipboard(LOCATION_DATA.address, "✅ تم نسخ العنوان");
  document.getElementById('copyCoordsBtn').onclick = () => copyToClipboard(`${LOCATION_DATA.latitude}, ${LOCATION_DATA.longitude}`, "✅ تم نسخ الإحداثيات");
  document.getElementById('shareLocationBtn').onclick = async () => {
    if(navigator.share) {
      try { await navigator.share({ title: 'موقعي', text: LOCATION_DATA.address, url: getGoogleMapsLink() }); } catch(e) {}
    } else {
      copyToClipboard(getGoogleMapsLink(), "✅ تم نسخ رابط الموقع");
    }
  };
}

function copyToClipboard(text, msg) {
  navigator.clipboard.writeText(text).then(() => showToast(msg)).catch(() => { 
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); showToast(msg);
  });
}

function showToast(msg) {
  const t = document.createElement('div'); t.className = 'copy-success'; t.innerText = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2000);
}

function escapeHtml(str) { return str.replace(/[&<>]/g, function(m) { if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m; }); }

// ========== PWA Installation ==========
let deferredPrompt = null;
const installBtn = document.getElementById('installBtn');

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  installBtn.style.display = 'flex';
  console.log('✅ PWA installation ready');
});

// ========== باقي الكود الأصلي للتقويم والأذان (مختصر للطول لكن كامل الوظائف) ==========
const CITIES = [
  { name: 'القاهرة', lat: 30.0444, lng: 31.2357 },
  { name: 'الإسكندرية', lat: 31.2001, lng: 29.9187 },
  { name: 'المنصورة', lat: 31.0364, lng: 31.3807 },
  { name: 'أسوان', lat: 24.0889, lng: 32.8998 },
];
const AR_DAYS = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const EN_DAYS = ['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];
const AR_MONTHS_G = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const EN_MONTHS = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
const SYRIAC_MONTHS = ['كانون الثاني','شباط','آذار','نيسان','أيار','حزيران','تموز','آب','أيلول','تشرين الأول','تشرين الثاني','كانون الأول'];
const AR_MONTHS_H = ['محرم','صفر','ربيع الأول','ربيع الآخر','جمادى الأولى','جمادى الآخرة','رجب','شعبان','رمضان','شوال','ذو القعدة','ذو الحجة'];
const COPTIC_MONTHS = ['توت','بابه','هاتور','كيهك','طوبه','أمشير','برمهات','برموده','بشنس','بؤونه','أبيب','مسرى','النسيء'];

let currentDisplayDate = new Date();
let activePickerDate = new Date();
let isLoading = false;
let prayerData = null;
let countdownInterval = null;
let alertedFor = null;
let azanAudio = null;

function toAr(n) { return String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]); }
function isToday() { return currentDisplayDate.toDateString() === new Date().toDateString(); }
function toMins(t24, offset) { if(!t24) return null; const [h,m] = t24.slice(0,5).split(':'); if(!h||!m) return null; return parseInt(h)*60+parseInt(m)+(offset||0); }
function fmtTime(t24, offset) { const total = toMins(t24,offset); if(total===null) return '--:--'; const h=Math.floor((total%1440)/60), m=total%60, h12=(h%12)||12, ampm=h<12?'ص':'م'; return `${h12}:${String(m).padStart(2,'0')} ${ampm}`; }
function convertTo12HourFormat(t24) { if(!t24) return '--:--'; const [h,m]=t24.split(':'); return `${m} ${(parseInt(h)%12)||12}`; }
function toCoptic(date) { let y=date.getFullYear()-283; let ny=new Date(date.getFullYear(),8,11); if(date<ny){ y--; ny=new Date(date.getFullYear()-1,8,11); } const diff=Math.floor((date-ny)/86400000); return { day:diff%30+1, month:Math.floor(diff/30), year:y }; }

document.getElementById('locationBtn').addEventListener('click', showLocationPopup);

const AZAN_URLS = ['azan.mp3','https://ia800203.us.archive.org/33/items/AzanFajrPrayerFromTheHolyMosqueInMecca/Azan_Fajr_-_Holy_Mosque_Mecca.mp3'];
function unlockAudio() { if(window.audioUnlocked) return; window.audioUnlocked=true; try{ new AudioContext().resume(); }catch(e){} }
document.addEventListener('click', unlockAudio, { once: true });

async function playAlert(prayerName) {
  unlockAudio();
  if(azanAudio){ azanAudio.pause(); azanAudio=null; }
  for(const url of AZAN_URLS) {
    try{ const a=new Audio(url); a.volume=1; await a.play(); azanAudio=a; return; }catch(e){}
  }
}

function updateCountdown() {
  const section = document.getElementById('nextPrayerSection');
  if(!isToday()) { if(section) section.style.display='none'; return; }
  if(section) section.style.display='';
  if(!prayerData||!prayerData.timings) return;
  const now=new Date(), curMin=now.getHours()*60+now.getMinutes(), curSec=now.getSeconds();
  const t=prayerData.timings;
  const list = [
    { name:'الفجر', mins:toMins(t.Fajr,0), disp:fmtTime(t.Fajr,0), key:'fajr' },
    { name:'الشروق', mins:toMins(t.Sunrise,0), disp:fmtTime(t.Sunrise,0), key:'sunrise' },
    { name:'الظهر', mins:toMins(t.Dhuhr,0), disp:fmtTime(t.Dhuhr,0), key:'dhuhr' },
    { name:'العصر', mins:toMins(t.Asr,0), disp:fmtTime(t.Asr,0), key:'asr' },
    { name:'المغرب', mins:toMins(t.Maghrib,0), disp:fmtTime(t.Maghrib,0), key:'maghrib' },
    { name:'العشاء', mins:toMins(t.Isha,0), disp:fmtTime(t.Isha,0), key:'isha' }
  ].filter(p=>p.mins!==null);
  if(!list.length) return;
  let curTotal=curMin*60+curSec;
  let next=list.find(p=>p.mins*60>curTotal)||list[0];
  let diff=next.mins*60-curTotal;
  if(diff<=0) diff+=86400;
  const hrs=Math.floor(diff/3600), mins=Math.floor((diff%3600)/60), secs=diff%60;
  document.getElementById('nextPrayerName').textContent=next.name;
  document.getElementById('nextPrayerTime').textContent=next.disp;
  document.getElementById('countdownTimer').textContent=`${String(hrs).padStart(2,'0')}:${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
  if(hrs===0&&mins===0&&secs<=4&&alertedFor!==next.key){ alertedFor=next.key; playAlert(next.name); }
  if(diff>60&&alertedFor===next.key) alertedFor=null;
}

async function fetchHijriDate(date) {
  try{ const r=await fetch(`https://api.aladhan.com/v1/gToH/${date.getDate()}-${date.getMonth()+1}-${date.getFullYear()}`); const d=await r.json(); if(d.code===200) return { day:parseInt(d.data.hijri.day), monthName:d.data.hijri.month.ar, year:parseInt(d.data.hijri.year) }; }catch(e){}
  return null;
}
async function fetchPrayerTimesRaw(date,city) {
  try{ const r=await fetch(`https://api.aladhan.com/v1/timings/${date.getDate()}-${date.getMonth()+1}-${date.getFullYear()}?latitude=${city.lat}&longitude=${city.lng}&method=5&school=0&timezonestring=Africa/Cairo`); const d=await r.json(); if(d.code===200) return d.data; }catch(e){}
  return null;
}
function extractDisplayTimes(raw){ if(!raw) return null; const t=raw.timings; return { fajr:convertTo12HourFormat(t.Fajr.slice(0,5)), sunrise:convertTo12HourFormat(t.Sunrise.slice(0,5)), dhuhr:convertTo12HourFormat(t.Dhuhr.slice(0,5)), asr:convertTo12HourFormat(t.Asr.slice(0,5)), maghrib:convertTo12HourFormat(t.Maghrib.slice(0,5)), isha:convertTo12HourFormat(t.Isha.slice(0,5)) }; }
function updateGregorianDisplay(date){ document.getElementById('dayAr').innerText=AR_DAYS[date.getDay()]; document.getElementById('dayEn').innerText=EN_DAYS[date.getDay()]; document.getElementById('gregDay').innerText=toAr(date.getDate()); document.getElementById('gregMonth').innerHTML=`${AR_MONTHS_G[date.getMonth()]} <span class="date-month-syr">(${SYRIAC_MONTHS[date.getMonth()]})</span>`; document.getElementById('gregYear').innerText=toAr(date.getFullYear()); document.getElementById('gregLineFull').innerText=`${date.getDate()} ${EN_MONTHS[date.getMonth()]} ${date.getFullYear()}`; const cop=toCoptic(date); document.getElementById('copticSpan').innerText=`${toAr(cop.day)} ${COPTIC_MONTHS[cop.month%13]} ${toAr(cop.year)}`; }
function updateHijriDisplay(h){ if(h){ document.getElementById('hijriDay').innerText=toAr(h.day); document.getElementById('hijriMonth').innerText=h.monthName; document.getElementById('hijriYear').innerText=toAr(h.year); } }
function updatePrayerTableDisplay(all){ const tbody=document.getElementById('prayerBody'); tbody.innerHTML=''; for(let i=0;i<CITIES.length;i++){ const row=tbody.insertRow(); row.insertCell(0).innerText=CITIES[i].name; if(all[i]){ row.insertCell(1).innerHTML=`<span>${all[i].fajr}</span>`; row.insertCell(2).innerHTML=`<span>${all[i].sunrise}</span>`; row.insertCell(3).innerHTML=`<span>${all[i].dhuhr}</span>`; row.insertCell(4).innerHTML=`<span>${all[i].asr}</span>`; row.insertCell(5).innerHTML=`<span>${all[i].maghrib}</span>`; row.insertCell(6).innerHTML=`<span>${all[i].isha}</span>`; }else{ const c=row.insertCell(1); c.colSpan=6; c.innerText='خطأ'; } } }
async function refreshWidget(date){ if(isLoading) return; isLoading=true; updateGregorianDisplay(date); try{ const hij=await fetchHijriDate(date); if(hij) updateHijriDisplay(hij); const raw=await Promise.all(CITIES.map(c=>fetchPrayerTimesRaw(date,c))); if(raw[0]) prayerData=raw[0]; const disp=raw.map(r=>extractDisplayTimes(r)); updatePrayerTableDisplay(disp); updateCountdown(); }catch(e){} isLoading=false; }
function startCountdownTimer(){ if(countdownInterval) clearInterval(countdownInterval); countdownInterval=setInterval(updateCountdown,1000); }
function openDatePicker(){ activePickerDate=new Date(currentDisplayDate); renderPicker(); }
function closePicker(){ const m=document.querySelector('.datepicker-overlay'); if(m) m.remove(); }
function renderPicker(){ closePicker(); const overlay=document.createElement('div'); overlay.className='datepicker-overlay'; const y=activePickerDate.getFullYear(), m=activePickerDate.getMonth(); const firstDay=new Date(y,m,1).getDay(), daysInMonth=new Date(y,m+1,0).getDate(); let grid=[]; for(let i=0;i<firstDay;i++) grid.push(null); for(let d=1;d<=daysInMonth;d++) grid.push(new Date(y,m,d)); while(grid.length%7!==0) grid.push(null); const weekdays=['أحد','إثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت']; overlay.innerHTML=`<div class="datepicker-modal"><div class="year-month-control"><button id="prevYear">««</button><button id="prevMonth">‹</button><span id="monthYear">${AR_MONTHS_G[m]} ${toAr(y)}</span><button id="nextMonth">›</button><button id="nextYear">»»</button></div><div class="picker-grid" id="pickerGrid"></div><div class="picker-actions"><button id="todayBtn">📅 اليوم</button><button id="closeBtn" class="outline">إلغاء</button></div></div>`; document.body.appendChild(overlay); function buildGrid(){ const cont=document.getElementById('pickerGrid'); cont.innerHTML=''; weekdays.forEach(wd=>{ const d=document.createElement('div'); d.className='picker-weekday'; d.innerText=wd; cont.appendChild(d); }); grid.forEach(dt=>{ const div=document.createElement('div'); div.className='picker-day'; if(!dt){ div.classList.add('empty'); div.innerText=''; }else{ div.innerText=toAr(dt.getDate()); if(dt.toDateString()===currentDisplayDate.toDateString()) div.classList.add('selected'); div.onclick=async()=>{ currentDisplayDate=new Date(dt); await refreshWidget(currentDisplayDate); closePicker(); }; } cont.appendChild(div); }); } function updateGrid(){ const ny=activePickerDate.getFullYear(), nm=activePickerDate.getMonth(); document.getElementById('monthYear').innerText=`${AR_MONTHS_G[nm]} ${toAr(ny)}`; const fd=new Date(ny,nm,1).getDay(), dim=new Date(ny,nm+1,0).getDate(); let ng=[]; for(let i=0;i<fd;i++) ng.push(null); for(let d=1;d<=dim;d++) ng.push(new Date(ny,nm,d)); while(ng.length%7!==0) ng.push(null); grid=ng; buildGrid(); } document.getElementById('prevMonth').onclick=()=>{ activePickerDate.setMonth(activePickerDate.getMonth()-1); updateGrid(); }; document.getElementById('nextMonth').onclick=()=>{ activePickerDate.setMonth(activePickerDate.getMonth()+1); updateGrid(); }; document.getElementById('prevYear').onclick=()=>{ activePickerDate.setFullYear(activePickerDate.getFullYear()-1); updateGrid(); }; document.getElementById('nextYear').onclick=()=>{ activePickerDate.setFullYear(activePickerDate.getFullYear()+1); updateGrid(); }; document.getElementById('todayBtn').onclick=async()=>{ currentDisplayDate=new Date(); await refreshWidget(currentDisplayDate); closePicker(); }; document.getElementById('closeBtn').onclick=closePicker; overlay.onclick=e=>{ if(e.target===overlay) closePicker(); }; buildGrid(); }
function attachEvents(){ ['dayAr','dayEn','gregBlock','hijriBlock','gregLineFullBlock'].forEach(id=>{ const el=document.getElementById(id); if(el) el.addEventListener('click',openDatePicker); }); }
let darkModeManual=null;
function isDarkTime(){ if(!prayerData||!prayerData.timings){ const h=new Date().getHours(); return h>=19||h<6; } const now=new Date(), cur=now.getHours()*60+now.getMinutes(), mag=toMins(prayerData.timings.Maghrib,0), faj=toMins(prayerData.timings.Fajr,0); if(mag===null||faj===null) return false; return cur>=mag||cur<faj; }
function applyDarkMode(dark){ document.body.classList.toggle('dark-mode',dark); document.getElementById('darkToggle').textContent=dark?'☀️':'🌙'; }
function checkAutoTheme(){ if(darkModeManual!==null) return; applyDarkMode(isDarkTime()); }
document.getElementById('darkToggle').addEventListener('click',()=>{ const isDark=document.body.classList.contains('dark-mode'); darkModeManual=!isDark; applyDarkMode(darkModeManual); setTimeout(()=>{ darkModeManual=null; checkAutoTheme(); },6*3600*1000); });
setInterval(checkAutoTheme,60000); checkAutoTheme();
attachEvents(); startCountdownTimer(); refreshWidget(new Date());

// إضافة playAlert للنافذة العامة
window.playAlert = playAlert;
</script>
