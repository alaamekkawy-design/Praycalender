<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام تحديد الموقع GPS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            background: #1a2f3f;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .header h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        .header p {
            opacity: 0.9;
            font-size: 0.9rem;
        }

        .content {
            padding: 25px;
        }

        .info-card {
            background: #f0f4f8;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #dce4ec;
            flex-wrap: wrap;
            gap: 8px;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .label {
            font-weight: 700;
            color: #2c3e50;
            font-size: 1rem;
        }

        .value {
            font-family: 'Courier New', monospace;
            font-weight: 600;
            color: #2980b9;
            word-break: break-all;
            text-align: left;
        }

        .address-box {
            background: #e8f4f8;
            border-radius: 20px;
            padding: 20px;
            margin-top: 15px;
            border-right: 4px solid #3498db;
        }

        .address-title {
            font-weight: 700;
            margin-bottom: 10px;
            color: #2c3e50;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .address-text {
            color: #34495e;
            line-height: 1.5;
            font-size: 0.95rem;
        }

        .buttons {
            display: flex;
            gap: 15px;
            margin: 20px 0 10px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: #2c7da0;
            color: white;
        }

        .btn-primary:hover {
            background: #1f5e7a;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #61a5c2;
            color: white;
        }

        .btn-secondary:hover {
            background: #3d8bb0;
            transform: translateY(-2px);
        }

        .status {
            background: #1a2f3f;
            color: white;
            padding: 12px;
            text-align: center;
            font-size: 0.85rem;
            border-radius: 30px;
            margin-top: 20px;
        }

        .status.error {
            background: #c0392b;
        }

        .status.success {
            background: #27ae60;
        }

        button:active {
            transform: translateY(1px);
        }

        @media (max-width: 500px) {
            .info-row {
                flex-direction: column;
            }
            .label {
                margin-bottom: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📍 موقعي الجغرافي</h1>
            <p>GPS | دقة عالية | يعمل بعد التثبيت</p>
        </div>
        <div class="content">
            <div class="info-card">
                <div class="info-row">
                    <span class="label">🌐 خط العرض (Decimal):</span>
                    <span class="value" id="lat-decimal">--.------°</span>
                </div>
                <div class="info-row">
                    <span class="label">🧭 خط العرض (DMS):</span>
                    <span class="value" id="lat-dms">--° --' --"</span>
                </div>
                <div class="info-row">
                    <span class="label">🗺️ خط الطول (Decimal):</span>
                    <span class="value" id="lon-decimal">--.------°</span>
                </div>
                <div class="info-row">
                    <span class="label">🧭 خط الطول (DMS):</span>
                    <span class="value" id="lon-dms">--° --' --"</span>
                </div>
            </div>

            <div class="address-box">
                <div class="address-title">
                    📬 العنوان التفصيلي
                </div>
                <div class="address-text" id="address">
                    جاري جلب العنوان...
                </div>
            </div>

            <div class="buttons">
                <button class="btn-primary" id="refreshBtn">🔄 تحديث الموقع</button>
                <button class="btn-secondary" id="copyBtn">📋 نسخ البيانات</button>
            </div>

            <div class="status" id="statusMsg">
                📡 جاهز - اضغط تحديث للحصول على الموقع
            </div>
        </div>
    </div>

    <script>
        // المتغيرات العامة
        let currentLat = null;
        let currentLon = null;
        let currentAddress = "لم يتم الحصول على الموقع بعد";

        // تحويل Decimal إلى DMS
        function toDMS(coordinate, isLatitude) {
            const absolute = Math.abs(coordinate);
            const degrees = Math.floor(absolute);
            const minutesFull = (absolute - degrees) * 60;
            const minutes = Math.floor(minutesFull);
            const seconds = (minutesFull - minutes) * 60;
            const secondsFixed = seconds.toFixed(4);
            
            let direction = '';
            if (isLatitude) {
                direction = coordinate >= 0 ? 'N' : 'S';
            } else {
                direction = coordinate >= 0 ? 'E' : 'W';
            }
            
            return `${direction} ${degrees}°${minutes}'${secondsFixed}"`;
        }

        // تحديث واجهة الإحداثيات
        function updateCoordinates(lat, lon) {
            if (lat === null || lon === null) return;
            
            document.getElementById('lat-decimal').textContent = lat.toFixed(6) + '°';
            document.getElementById('lon-decimal').textContent = lon.toFixed(6) + '°';
            document.getElementById('lat-dms').textContent = toDMS(lat, true);
            document.getElementById('lon-dms').textContent = toDMS(lon, false);
        }

        // جلب العنوان العكسي
        async function fetchAddress(lat, lon) {
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1&accept-language=ar`);
                const data = await response.json();
                if (data && data.display_name) {
                    return data.display_name;
                }
                return `${lat.toFixed(5)}°, ${lon.toFixed(5)}° (لم يتم العثور على عنوان دقيق)`;
            } catch (error) {
                console.error('خطأ في جلب العنوان:', error);
                return `⚠️ تعذر جلب العنوان - الإحداثيات: ${lat.toFixed(5)}°, ${lon.toFixed(5)}°`;
            }
        }

        // الحصول على الموقع الحالي
        function getCurrentLocation() {
            const statusDiv = document.getElementById('statusMsg');
            
            if (!navigator.geolocation) {
                statusDiv.textContent = '❌ متصفحك لا يدعم خاصية تحديد الموقع';
                statusDiv.className = 'status error';
                return;
            }

            statusDiv.textContent = '⏳ جاري الوصول إلى GPS... يرجى السماح بالموقع';
            statusDiv.className = 'status';

            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const accuracy = position.coords.accuracy;
                    
                    currentLat = lat;
                    currentLon = lon;
                    
                    // تحديث الإحداثيات
                    updateCoordinates(lat, lon);
                    
                    // تحديث حالة النجاح
                    statusDiv.textContent = `✅ تم تحديد الموقع بنجاح (دقة ≈ ${Math.round(accuracy)} متر)`;
                    statusDiv.className = 'status success';
                    
                    // جلب العنوان
                    document.getElementById('address').textContent = '🏗️ جاري جلب العنوان...';
                    const address = await fetchAddress(lat, lon);
                    currentAddress = address;
                    document.getElementById('address').textContent = address;
                },
                (error) => {
                    let errorMessage = '';
                    switch(error.code) {
                        case error.PERMISSION_DENIED:
                            errorMessage = '🚫 تم رفض الوصول إلى الموقع. يرجى السماح في إعدادات المتصفح';
                            break;
                        case error.POSITION_UNAVAILABLE:
                            errorMessage = '📡 معلومات الموقع غير متوفرة. تأكد من تشغيل GPS';
                            break;
                        case error.TIMEOUT:
                            errorMessage = '⏰ انتهى وقت المحاولة. حاول مرة أخرى';
                            break;
                        default:
                            errorMessage = '⚠️ خطأ: ' + error.message;
                    }
                    statusDiv.textContent = errorMessage;
                    statusDiv.className = 'status error';
                    document.getElementById('address').textContent = '❌ فشل الحصول على الموقع - تأكد من السماح بالوصول إلى GPS';
                    
                    // عرض موقع تجريبي كبديل (القاهرة)
                    currentLat = 30.0444;
                    currentLon = 31.2357;
                    updateCoordinates(currentLat, currentLon);
                },
                {
                    enableHighAccuracy: true,
                    timeout: 15000,
                    maximumAge: 0
                }
            );
        }

        // نسخ البيانات
        async function copyLocationData() {
            if (currentLat === null || currentLon === null) {
                const statusDiv = document.getElementById('statusMsg');
                statusDiv.textContent = '⚠️ لا توجد بيانات حالياً. اضغط "تحديث الموقع" أولاً';
                statusDiv.className = 'status error';
                setTimeout(() => {
                    if (statusDiv.className === 'status error') {
                        statusDiv.textContent = '📡 جاهز - اضغط تحديث للحصول على الموقع';
                        statusDiv.className = 'status';
                    }
                }, 3000);
                return;
            }
            
            const dataToCopy = {
                الوقت: new Date().toLocaleString('ar-EG'),
                خط_العرض: {
                    عشري: currentLat,
                    dms: toDMS(currentLat, true)
                },
                خط_الطول: {
                    عشري: currentLon,
                    dms: toDMS(currentLon, false)
                },
                العنوان: currentAddress
            };
            
            const jsonString = JSON.stringify(dataToCopy, null, 2);
            
            try {
                await navigator.clipboard.writeText(jsonString);
                const statusDiv = document.getElementById('statusMsg');
                statusDiv.textContent = '📋 تم نسخ البيانات بنجاح!';
                statusDiv.className = 'status success';
                setTimeout(() => {
                    if (statusDiv.className === 'status success') {
                        statusDiv.textContent = '✅ جاهز - الموقع محدث';
                        statusDiv.className = 'status';
                    }
                }, 2000);
            } catch (err) {
                alert('يمكنك نسخ البيانات يدوياً:\n' + jsonString);
            }
        }

        // تحميل الصفحة
        window.addEventListener('load', () => {
            getCurrentLocation();
        });
        
        // أزرار
        document.getElementById('refreshBtn').addEventListener('click', getCurrentLocation);
        document.getElementById('copyBtn').addEventListener('click', copyLocationData);
    </script>
</body>
</html>
